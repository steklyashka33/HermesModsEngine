name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout HermesModsEngine
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest yamllint
          pip install -e ".[dev]" || true

      - name: Lint YAML manifests
        run: |
          yamllint -c .yamllint.yml .

      - name: Checkout Hermes Agent Core (for AST and target resolution)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent-core
          fetch-depth: 1

      - name: Run Engine & Mods Static Validation (Strict Layout)
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent-core
        run: |
          python3 runner.py validate --strict-layout

      - name: Run Mod Test Suite
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent-core
        run: |
          python3 runner.py test

      - name: Run Engine Unit Tests
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent-core
        run: |
          pytest tests/ -v
