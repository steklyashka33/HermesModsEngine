- file: agent/skill_utils.py
  description: Add get_mod_skills_dirs function and cache
  old_block: |-
    _EXTERNAL_DIRS_CACHE: dict[tuple[str, int, int, int, int], list[Path]] = {}


    def _external_dirs_cache_clear() -> None:
  new_block: |-
    _EXTERNAL_DIRS_CACHE: dict[tuple[str, int, int, int, int], list[Path]] = {}
    _MOD_SKILLS_CACHE: dict[tuple, list[Path]] = {}


    def _mod_skills_dirs_cache_clear() -> None:
        """Test hook — drop the in-process mod skills cache."""
        _MOD_SKILLS_CACHE.clear()


    def _get_mod_skills_cache_key(mods_dir: Path) -> tuple:
        """Compute mtime signature of mods_dir and all its folder mods."""
        try:
            entries: list[Any] = [mods_dir.stat().st_mtime_ns]
            for e in sorted(mods_dir.iterdir()):
                if e.is_dir() and not e.name.startswith((".", "_")) and not e.name.endswith(".disabled"):
                    manifest = e / "mod.yaml"
                    if not manifest.exists():
                        manifest = e / f"{e.name}.yaml"
                    m_mtime = manifest.stat().st_mtime_ns if manifest.exists() else 0
                    s_dir = e / "skills"
                    s_mtime = s_dir.stat().st_mtime_ns if s_dir.is_dir() else 0
                    entries.append((e.name, m_mtime, s_mtime))
            return tuple(entries)
        except OSError:
            return (0,)


    def get_mod_skills_dirs() -> list[Path]:
        """Discover skills directories inside active (enabled: true) folder mods under HERMES_HOME/mods.
        Safe against mod engine failures, missing engine, or malformed manifests.
        """
        try:
            from hermes_constants import get_hermes_home
            mods_dir = get_hermes_home() / "mods"
            if not mods_dir.is_dir():
                return []

            cache_key = _get_mod_skills_cache_key(mods_dir)
            cached = _MOD_SKILLS_CACHE.get(cache_key)
            if cached is not None:
                return list(cached)

            dirs: list[Path] = []
            for entry in sorted(mods_dir.iterdir()):
                if entry.name.startswith((".", "_")) or entry.name.endswith(".disabled"):
                    continue
                if not entry.is_dir():
                    continue
                skills_sub = entry / "skills"
                if not skills_sub.is_dir():
                    continue
                try:
                    if not skills_sub.resolve().is_relative_to(entry.resolve()):
                        continue
                except OSError:
                    continue

                manifest = entry / "mod.yaml"
                if not manifest.exists():
                    manifest = entry / f"{entry.name}.yaml"
                if not manifest.exists():
                    continue

                try:
                    data = yaml_load(manifest.read_text(encoding="utf-8"))
                    if isinstance(data, dict) and data.get("enabled", True) is False:
                        continue
                except Exception:
                    continue

                dirs.append(skills_sub)

            _MOD_SKILLS_CACHE[cache_key] = list(dirs)
            return list(dirs)
        except Exception as exc:
            logger.debug("Failed to discover mod skills dirs: %s", exc)
            return []


    def _external_dirs_cache_clear() -> None:
