id: mod-update-integration
name: Mod Update Integration
description: Three-phase update pipeline (engine pre-update -> Hermes core update
  -> mods reapply) for /update and hermes update
version: 1.3.0
author: Engine
enabled: true
tests:
  test_slash_commands_update_hook: 'import inspect

    from gateway import slash_commands

    source = inspect.getsource(slash_commands)

    assert "_reapply_cmd" in source

    assert "_engine_preupdate_cmd" in source or "--no-apply" in source

    assert "--watchdog" in source

    '
  test_cli_update_maintenance_hook: 'import inspect

    from hermes_cli import update_cmd_maint

    source = inspect.getsource(update_cmd_maint)

    assert "_reapply_hermes_mods" in source

    assert "_pre_update_hermes_mods" in source

    assert "mods_reapply" in source

    assert "--watchdog" in source

    '
targets:
- file: gateway/slash_commands.py
  description: Execute 3-phase update pipeline in detached /update command
  old_block: "    hermes_cmd_str = \" \".join(shlex.quote(part) for part in hermes_cmd)\n\
    \    update_cmd = (\n        f\"PYTHONUNBUFFERED=1 {hermes_cmd_str} update --gateway\"\
    \n        f\" > {shlex.quote(str(output_path))} 2>&1; \"\n        # Avoid `status=$?`:\
    \ `status` is read-only in zsh and this template is reused in\n        # macOS/zsh\
    \ operator wrappers, so keep it zsh-safe even though bash runs it here.\n    \
    \    # Temp + mv: the gateway watcher polls the exit code and reads an empty file\
    \ as failure.\n        f\"rc=$?; printf '%s' \\\"$rc\\\" > {shlex.quote(str(exit_code_path)\
    \ + '.tmp')}\"\n        f\" && mv -f {shlex.quote(str(exit_code_path) + '.tmp')}\
    \ {shlex.quote(str(exit_code_path))}\")\n"
  new_block: "    hermes_cmd_str = \" \".join(shlex.quote(part) for part in hermes_cmd)\n\
    \    _mods_runner = Path(os.environ.get(\"HERMES_MODS_DIR\", Path(os.environ.get(\"\
    HERMES_HOME\", Path.home() / \".hermes\")) / \"mods\")) / \"runner.py\"\n    _engine_preupdate_cmd\
    \ = f\"{shlex.quote(sys.executable)} {shlex.quote(str(_mods_runner))} update --no-apply\"\
    \n    _reapply_cmd = f\"{shlex.quote(sys.executable)} {shlex.quote(str(_mods_runner))}\
    \ apply --watchdog --watchdog-window 30\"\n    update_cmd = (\n        f\"printf\
    \ '→ Initializing Hermes update sequence...\\\\n' > {shlex.quote(str(output_path))}\
    \ 2>&1; \"\n        f\"if [ -f {shlex.quote(str(_mods_runner))} ]; then \"\n \
    \       f\"printf '\\\\n→ Updating Hermes mods engine (Phase 1/3)...\\\\n' >>\
    \ {shlex.quote(str(output_path))} 2>&1; \"\n        f\"{_engine_preupdate_cmd}\
    \ >> {shlex.quote(str(output_path))} 2>&1 || true; \"\n        f\"fi; \"\n   \
    \     f\"printf '\\\\n→ Updating Hermes Agent core (Phase 2/3)...\\\\n' >> {shlex.quote(str(output_path))}\
    \ 2>&1; \"\n        f\"PYTHONUNBUFFERED=1 {hermes_cmd_str} update --gateway\"\n\
    \        f\" >> {shlex.quote(str(output_path))} 2>&1; \"\n        f\"rc=$?; \"\
    \n        f\"if [ \\\"$rc\\\" -eq 0 ]; then \"\n        f\"if [ -f {shlex.quote(str(_mods_runner))}\
    \ ]; then \"\n        f\"printf '\\\\n→ Re-applying Hermes mods engine (Phase\
    \ 3/3)...\\\\n' >> {shlex.quote(str(output_path))} 2>&1; \"\n        f\"{_reapply_cmd}\
    \ >> {shlex.quote(str(output_path))} 2>&1; \"\n        f\"fi; \"\n        f\"\
    fi; \"\n        f\"printf '%s' \\\"$rc\\\" > {shlex.quote(str(exit_code_path)\
    \ + '.tmp')}\"\n        f\" && mv -f {shlex.quote(str(exit_code_path) + '.tmp')}\
    \ {shlex.quote(str(exit_code_path))}\")\n"
- file: hermes_cli/update_cmd_maint.py
  description: Pre-update mods engine before core files mutation
  old_block: "def _run_pre_update_backup(args) -> Optional[str]:\n    \"\"\"Run the\
    \ pre-update backup; return the quick-snapshot id (None when off/failed). Never\
    \ raises.\n\n    ``off`` — nothing. ``quick`` (default) — snapshot of critical\
    \ small files under\n    ``state-snapshots/``, files over 1 GiB skipped so a bloated\
    \ state.db can't stall the update.\n    ``full`` — quick snapshot PLUS a zip of\
    \ HERMES_HOME under ``backups/`` (``hermes import``).\n\n    Explicit user opt-out\
    \ is honored fully. See #34600.\n    \"\"\"\n    mode = _resolve_pre_update_backup_mode(args)\n"
  new_block: "def _pre_update_hermes_mods() -> None:\n    runner_path = Path(os.environ.get(\"\
    HERMES_MODS_DIR\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\"\
    )) / \"mods\")) / \"runner.py\"\n    if runner_path.is_file():\n        print(\"\
    → Updating Hermes mods engine (Phase 1/3)...\")\n        try:\n            subprocess.run([sys.executable,\
    \ str(runner_path), \"update\", \"--no-apply\"], check=False)\n        except\
    \ Exception as exc:\n            print(f\"  ⚠ Failed to update mods engine: {exc}\"\
    , file=sys.stderr)\n\n\ndef _run_pre_update_backup(args) -> Optional[str]:\n \
    \   \"\"\"Run the pre-update backup; return the quick-snapshot id (None when off/failed).\
    \ Never raises.\n\n    ``off`` — nothing. ``quick`` (default) — snapshot of critical\
    \ small files under\n    ``state-snapshots/``, files over 1 GiB skipped so a bloated\
    \ state.db can't stall the update.\n    ``full`` — quick snapshot PLUS a zip of\
    \ HERMES_HOME under ``backups/`` (``hermes import``).\n\n    Explicit user opt-out\
    \ is honored fully. See #34600.\n    \"\"\"\n    _pre_update_hermes_mods()\n \
    \   mode = _resolve_pre_update_backup_mode(args)\n"
- file: hermes_cli/update_cmd_maint.py
  description: Reapply mods during post-update maintenance step
  old_block: "    owed_step(\"config_migration\", lambda: _check_and_apply_config_migration(\n\
    \        assume_yes=assume_yes, gateway_mode=gateway_mode, pre_update_snapshot_id=pre_update_snapshot_id,\n\
    \    ))\n\n    print()\n    update_complete = _print_verified_update_completion(completion_message\
    \ or _update_complete_message(pre_update_version))\n"
  new_block: "    owed_step(\"config_migration\", lambda: _check_and_apply_config_migration(\n\
    \        assume_yes=assume_yes, gateway_mode=gateway_mode, pre_update_snapshot_id=pre_update_snapshot_id,\n\
    \    ))\n\n    def _reapply_hermes_mods() -> None:\n        runner_path = Path(os.environ.get(\"\
    HERMES_MODS_DIR\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\"\
    )) / \"mods\")) / \"runner.py\"\n        if runner_path.is_file():\n         \
    \   print(\"→ Re-applying Hermes mods engine (Phase 3/3)...\")\n            try:\n\
    \                subprocess.run([sys.executable, str(runner_path), \"apply\",\
    \ \"--watchdog\", \"--watchdog-window\", \"30\"], check=False)\n            except\
    \ Exception as exc:\n                print(f\"  ⚠ Failed to re-apply mods: {exc}\"\
    , file=sys.stderr)\n\n    owed_step(\"mods_reapply\", _reapply_hermes_mods)\n\n\
    \    print()\n    update_complete = _print_verified_update_completion(completion_message\
    \ or _update_complete_message(pre_update_version))\n"
