- file: hermes_cli/commands.py
  description: Read mod commands via _get_mod_command_registry factory and dynamic resolution
  old_block: "def resolve_command(name: str) -> CommandDef | None:\n    \"\"\"Resolve a command name or alias (leading slash optional) to its CommandDef.\"\"\"\n    return _COMMAND_LOOKUP.get(name.lower().lstrip(\"/\"))"
  new_block: "def _get_mod_command_registry():\n    \"\"\"Dynamically load and return ModCommandRegistry singleton from mod-command-registry.\"\"\"\n    try:\n        import sys\n        if \"gateway.mod_commands\" in sys.modules:\n            return sys.modules[\"gateway.mod_commands\"].ModCommandRegistry.get_instance()\n        import importlib.util\n        import os\n        from pathlib import Path\n        mods_dir = Path(os.environ.get(\"HERMES_MODS_DIR\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\")) / \"mods\"))\n        mod_file = mods_dir / \"system\" / \"mod-command-registry\" / \"mod_commands.py\"\n        if not mod_file.exists():\n            ws_file = Path.home() / \"workspaces\" / \"hermes-mods\" / \"system\" / \"mod-command-registry\" / \"mod_commands.py\"\n            if ws_file.exists():\n                mod_file = ws_file\n        if mod_file.exists():\n            spec = importlib.util.spec_from_file_location(\"gateway.mod_commands\", str(mod_file))\n            if spec and\
    \ spec.loader:\n                mod = importlib.util.module_from_spec(spec)\n                sys.modules[\"gateway.mod_commands\"] = mod\n                spec.loader.exec_module(mod)\n                return mod.ModCommandRegistry.get_instance()\n    except Exception:\n        pass\n    return None\n\ndef _iter_mod_command_entries() -> list[tuple[str, str, dict]]:\n    \"\"\"Load registered mod commands from ModCommandRegistry / .commands_cache.json.\"\"\"\n    try:\n        registry = _get_mod_command_registry()\n        if registry:\n            return registry.get_command_entries()\n    except Exception:\n        pass\n    try:\n        import os\n        import json\n        from pathlib import Path\n        _mods_dir = Path(os.environ.get(\"HERMES_MODS_DIR\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\")) / \"mods\"))\n        cache_file = _mods_dir / \".commands_cache.json\"\n        if cache_file.exists():\n            with open(cache_file, \"r\", encoding=\"\
    utf-8\") as f:\n                data = json.load(f)\n            cmds = data.get(\"commands\", {})\n            return [(name, c.get(\"description\", \"\"), c) for name, c in cmds.items()]\n    except Exception:\n        pass\n    return []\n\ndef resolve_command(name: str) -> CommandDef | None:\n    \"\"\"Resolve a command name or alias (leading slash optional) to its CommandDef.\"\"\"\n    clean_name = name.lower().lstrip(\"/\")\n    cmd = _COMMAND_LOOKUP.get(clean_name) or _COMMAND_LOOKUP.get(clean_name.replace(\"_\", \"-\")) or _COMMAND_LOOKUP.get(clean_name.replace(\"-\", \"_\"))\n    if cmd is not None:\n        return cmd\n    for mod_name, desc, meta in _iter_mod_command_entries():\n        aliases = tuple(meta.get(\"aliases\") or ())\n        candidates = {mod_name, mod_name.replace(\"_\", \"-\"), mod_name.replace(\"-\", \"_\")}\n        for a in aliases:\n            candidates.update((a, a.replace(\"_\", \"-\"), a.replace(\"-\", \"_\")))\n        if clean_name in candidates\
    \ or clean_name.replace(\"_\", \"-\") in candidates or clean_name.replace(\"-\", \"_\") in candidates:\n            return CommandDef(\n                name=mod_name,\n                description=desc,\n                category=meta.get(\"category\", \"Custom Mods\"),\n                aliases=aliases,\n                args_hint=meta.get(\"args_hint\", \"\"),\n                busy_policy=meta.get(\"busy_policy\", \"reject\"),\n                execute=\"mod_command\"\n            )\n    return None"
- file: hermes_cli/commands.py
  description: Support mod commands in is_gateway_known_command check via _get_mod_command_registry factory
  old_block: "def is_gateway_known_command(name: str | None) -> bool:\n    \"\"\"True if ``name`` is a built-in or plugin gateway slash command (plugins looked\n    up lazily); decides whether the gateway emits ``command:<name>`` hooks.\"\"\"\n    if not name:\n        return False\n    return name in GATEWAY_KNOWN_COMMANDS or any(\n        plugin_name == name for plugin_name, _d, _h in _iter_plugin_command_entries())"
  new_block: "def is_gateway_known_command(name: str | None) -> bool:\n    \"\"\"True if ``name`` is a built-in or plugin gateway slash command (plugins looked\n    up lazily); decides whether the gateway emits ``command:<name>`` hooks.\"\"\"\n    if not name:\n        return False\n    if name in GATEWAY_KNOWN_COMMANDS or any(\n        plugin_name == name for plugin_name, _d, _h in _iter_plugin_command_entries()):\n        return True\n    try:\n        registry = _get_mod_command_registry()\n        if registry:\n            return registry.is_known_command(name)\n    except Exception:\n        return False\n\n\n# Commands with explicit mid-run handling (busy_policy != \"reject\"). Kept\n# under its historical name for introspection/tests; the real bypass set is\n# every resolvable command (see should_bypass_active_session)."
- file: gateway/run_inbound.py
  description: Dispatch and execute mod command handlers via _get_mod_command_registry factory in idle chain
  old_block: "    async def _hm_dispatch_idle_commands(\n        self, event: MessageEvent, source: SessionSource, _quick_key: str\n    ) -> tuple[bool, Optional[str]]:\n        \"\"\"Idle path: resolve + dispatch slash commands; rewriting commands fall through to the agent.\n        A command rewritten into a turn keeps the /stop and /new epoch it arrived under, read before\n        the (slow, off-loop) rewrite, so a reset during it drops the command, as on the busy path.\"\"\"\n        stop_epoch = self._route_stop_epoch(_quick_key)\n        _handled, _result, command, canonical = await self._hm_resolve_command(event, source, _quick_key)\n        if not _handled:\n            _handled, _result = await self._hm_dispatch_canonical_command(event, source, _quick_key, canonical)\n        if not _handled:\n            _handled, _result, command = await self._hm_dispatch_quick_and_plugin_commands(event, source, command)\n        if not _handled:\n            # Skill-slash resolution is disk-bound\
    \ (cold skill scan, skill file loads, the\n            # unavailable-skill rglob over every skills dir) and uncached on a first hit; on a\n            # large install it held the loop past the liveness watchdog (#111091). The executor\n            # hop carries the profile contextvars the scan is scoped to.\n            _result = await self._run_in_executor_with_context(\n                self._hm_skill_slash_rewrite, event, source, _quick_key, command)\n            _handled = _result is not None\n        if not _handled and command:  # rewritten into a turn: the authority's FIFO, like text\n            _handled, _result = await self._admit_command_turn(event, source, _quick_key, stop_epoch)\n        return _handled, _result"
  new_block: "    async def _hm_dispatch_mod_command(self, event, source, command) -> tuple[bool, Optional[str]]:\n        if not command:\n            return False, None\n        try:\n            try:\n                from hermes_cli.commands import _get_mod_command_registry\n                registry = _get_mod_command_registry()\n            except Exception:\n                registry = None\n            if not registry:\n                import sys\n                if \"gateway.mod_commands\" in sys.modules:\n                    registry = sys.modules[\"gateway.mod_commands\"].ModCommandRegistry.get_instance()\n                else:\n                    import importlib.util\n                    import os\n                    from pathlib import Path\n                    mods_dir = Path(os.environ.get(\"HERMES_MODS_DIR\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\")) / \"mods\"))\n                    mod_file = mods_dir / \"system\" / \"mod-command-registry\" / \"mod_commands.py\"\
    \n                    if not mod_file.exists():\n                        ws_file = Path.home() / \"workspaces\" / \"hermes-mods\" / \"system\" / \"mod-command-registry\" / \"mod_commands.py\"\n                        if ws_file.exists():\n                            mod_file = ws_file\n                    if mod_file.exists():\n                        spec = importlib.util.spec_from_file_location(\"gateway.mod_commands\", str(mod_file))\n                        if spec and spec.loader:\n                            mod = importlib.util.module_from_spec(spec)\n                            sys.modules[\"gateway.mod_commands\"] = mod\n                            spec.loader.exec_module(mod)\n                            registry = mod.ModCommandRegistry.get_instance()\n            if not registry or not registry.is_known_command(command):\n                return False, None\n            denied = self._check_slash_access(source, command)\n            if denied is not None:\n                return True, denied\n    \
    \        result = await registry.dispatch(event, source, command)\n            return True, result\n        except Exception as exc:\n            logger.warning(\"Mod command dispatch failed for /%s: %s\", command, exc)\n            try:\n                from agent.i18n import t\n                err_msg = t(\"mods.command_registry.error\", canonical_name=command, exc=str(exc or repr(exc)))\n            except Exception:\n                err_msg = f\"⚠️ Execution error on /{command}: {exc or repr(exc)}\"\n            return True, err_msg\n\n    async def _hm_dispatch_idle_commands(\n        self, event: MessageEvent, source: SessionSource, _quick_key: str\n    ) -> tuple[bool, Optional[str]]:\n        \"\"\"Idle path: resolve + dispatch slash commands; rewriting commands fall through to the agent.\n        A command rewritten into a turn keeps the /stop and /new epoch it arrived under, read before\n        the (slow, off-loop) rewrite, so a reset during it drops the command, as on the busy path.\"\"\"\n        stop_epoch = self._route_stop_epoch(_quick_key)\n        _handled, _result, command, canonical = await self._hm_resolve_command(event, source, _quick_key)\n        if not _handled:\n            _handled, _result =\
    \ await self._hm_dispatch_canonical_command(event, source, _quick_key, canonical)\n        if not _handled:\n            _handled, _result = await self._hm_dispatch_mod_command(event, source, canonical or command)\n        if not _handled:\n            _handled, _result, command = await self._hm_dispatch_quick_and_plugin_commands(event, source, command)\n        if not _handled:\n            # Skill-slash resolution is disk-bound (cold skill scan, skill file loads, the\n            # unavailable-skill rglob over every skills dir) and uncached on a first hit; on a\n            # large install it held the loop past the liveness watchdog (#111091). The executor\n            # hop carries the profile contextvars the scan is scoped to.\n            _result = await self._run_in_executor_with_context(\n                self._hm_skill_slash_rewrite, event, source, _quick_key, command)\n            _handled = _result is not None\n        if not _handled and command:  # rewritten into a turn: the\
    \ authority's FIFO, like text\n            _handled, _result = await self._admit_command_turn(event, source, _quick_key, stop_epoch)\n        return _handled, _result"
