    dag_clean: "Clean (0 cycles)"
    dag_error: "ERROR: cycles detected"
    secrets: "Secrets storage: {status}"
    secrets_valid: "Valid (0600)"
    secrets_error: "ERROR: invalid permissions"
    core: "Hermes core: v{version} ({mode})"
    writable: "writable"
    read_only: "read-only"
