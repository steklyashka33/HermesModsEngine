- file: agent/i18n_layers.py
  description: Add mod_overlay_layer to surface_catalog in agent.i18n_layers
  old_block: "def surface_catalog(home: Path | str, lang: str, surface: str = CORE_SURFACE)\
    \ -> dict[str, str]:\n    \"\"\"Overlay + packs (packs win) for one surface —\
    \ the layer ``i18n.catalog`` ships to a renderer, which\n    merges it over its\
    \ own bundled catalog. Bundled Python locales are NOT included.\"\"\"\n    merged\
    \ = dict(overlay_layer(home, lang, surface))\n    merged.update(pack_layer(lang,\
    \ surface))\n    return merged"
  new_block: "def surface_catalog(home: Path | str, lang: str, surface: str = CORE_SURFACE)\
    \ -> dict[str, str]:\n    \"\"\"Overlay + packs + mod overlay (mod overlay wins)\
    \ for one surface — the layer ``i18n.catalog`` ships\n    to a renderer, which\
    \ merges it over its own bundled catalog. Bundled Python locales are NOT included.\"\
    \"\"\n    merged = dict(overlay_layer(home, lang, surface))\n    merged.update(pack_layer(lang,\
    \ surface))\n    merged.update(mod_overlay_layer(home, lang, surface))\n    return\
    \ merged"
