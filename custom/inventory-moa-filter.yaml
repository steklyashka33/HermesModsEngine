id: inventory-moa-filter
name: Inventory MoA Filter
description: Hiding disabled or excluded MoA providers from model inventory
version: 1.1.0
author: Hermes Admin
enabled: true
targets:
- file: hermes_cli/inventory.py
  old_block: "def _moa_provider_row(current_provider: str = \"\") -> dict | None:\n\
    \    \"\"\"The virtual ``moa`` row shared by the CLI inventory and gateway picker;\
    \ ``None`` without presets.\n\n    Strictly opt-in (#63353): the row only appears\
    \ when the user's raw config.yaml explicitly\n    enables at least one MoA preset.\
    \ The synthesized ``default`` preset from\n    ``normalize_moa_config({})`` —\
    \ which every user gets via DEFAULT_CONFIG defaults — must not\n    be treated\
    \ as a user choice.\"\"\"\n    if not _raw_config_has_enabled_moa_preset():\n\
    \        return None"
  new_block: "def _moa_provider_row(current_provider: str = \"\") -> dict | None:\n\
    \    \"\"\"The virtual ``moa`` row shared by the CLI inventory and gateway picker;\
    \ ``None`` without presets.\n\n    Strictly opt-in (#63353): the row only appears\
    \ when the user's raw config.yaml explicitly\n    enables at least one MoA preset.\
    \ The synthesized ``default`` preset from\n    ``normalize_moa_config({})`` —\
    \ which every user gets via DEFAULT_CONFIG defaults — must not\n    be treated\
    \ as a user choice.\"\"\"\n    try:\n        from hermes_cli.config import load_config\n\
    \        raw_cfg = load_config()\n        excl = (raw_cfg.get(\"model_catalog\"\
    ) or {}).get(\"excluded_providers\") or []\n        if isinstance(excl, list)\
    \ and any(str(x).strip().lower() == \"moa\" for x in excl):\n            return\
    \ None\n    except Exception:\n        pass\n    if not _raw_config_has_enabled_moa_preset():\n\
    \        return None"
  description: hide-disabled-or-excluded-moa-provider
