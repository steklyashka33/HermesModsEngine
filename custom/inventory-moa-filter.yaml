    description: 从模型清单中隐藏已禁用或已排除的MoA提供商
  ar:
    name: Inventory MoA Filter
    description: إخفاء موفري MoA المعطلين أو المستبعدين من مخزون النماذج
  de:
    name: Inventory MoA Filter
    description: Ausblenden deaktivierter oder ausgeschlossener MoA-Anbieter aus dem
