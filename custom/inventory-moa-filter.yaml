      de modelos
tests:
  test_moa_provider_row_filter: "from unittest.mock import patch\nfrom hermes_cli.inventory\
    \ import _moa_provider_row\nwith patch(\"hermes_cli.config.load_config\", return_value={\"\
    model_catalog\": {\"excluded_providers\": [\"moa\"]}}):\n    assert _moa_provider_row()\
    \ is None\n"
