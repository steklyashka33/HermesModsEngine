  old_block: "            local_files = []\n            if not is_ephemeral_response:\n\
    \                local_files, text_content = self.extract_local_files(text_content)\n\
    \                local_files = self.filter_local_delivery_paths(local_files, session_key=session_key)"
  new_block: "            local_files = []\n            extra = getattr(getattr(self,\
    \ \"config\", None), \"extra\", {}) or {}\n            auto_send_bare = bool(\n\
    \                (isinstance(extra, dict) and extra.get(\"auto_send_bare_files\"\
    , False))\n                or os.getenv(\"HERMES_AUTO_SEND_BARE_FILES\", \"\"\
    ).lower() in (\"1\", \"true\", \"yes\")\n            )\n            if not is_ephemeral_response\
    \ and auto_send_bare:\n                local_files, text_content = self.extract_local_files(text_content)\n\
    \                local_files = self.filter_local_delivery_paths(local_files, session_key=session_key)"
  description: disable-bare-local-file-auto-delivery
- file: gateway/platforms/base.py
  old_block: "    async def _send_plain_fallback(\n            self, chat_id: str,\
    \ content: str, *, reply_to: Optional[str], metadata: Any) -> SendResult:\n  \
    \      \"\"\"Last-resort send after a non-transient failure; platforms whose markup\
    \ is not the\n        likely culprit override it (Photon drops rich links instead\
    \ of adding the banner).\"\"\"\n        return await self.send(\n            chat_id=chat_id,\
    \ content=self.warning_text(\n                t(\"gateway.notify.plain_fallback_prefix\"\
    , content=content[:3500]), content[:3500],\n                chat_id=chat_id, metadata=metadata),\n\
    \            reply_to=reply_to, metadata=metadata)"
  new_block: "    async def _send_plain_fallback(\n            self, chat_id: str,\
    \ content: str, *, reply_to: Optional[str], metadata: Any) -> SendResult:\n  \
    \      \"\"\"Last-resort send after a non-transient failure. Deliver the raw content\
    \ directly without banners.\"\"\"\n        return await self.send(\n         \
    \   chat_id=chat_id, content=content,\n            reply_to=reply_to, metadata=metadata)"
  description: remove-plain-fallback-warning-banner
