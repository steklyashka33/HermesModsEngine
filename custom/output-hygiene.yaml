id: output-hygiene
name: Output & System Notices Hygiene
description: 'Hygiene for output and system notices: disable service banners, file-mutation
  verifier footers, bare local path delivery, and redundant error notices'
version: 1.4.0
author: Hermes Admin
enabled: true
targets:
- file: agent/turn_finalizer.py
  old_block: "def _append_file_mutation_footer(agent, final_response, logger):\n \
    \   \"\"\"Append the verifier advisory when ``write_file`` / ``patch`` calls failed\
    \ and were\n    never superseded by a successful write to the same path (surfaces\
    \ over-claiming).\"\"\"\n    try:\n        # File-mutation verifier footer. This\
    \ catches the specific case — reported by Ben Eng\n        # (#15524-adjacent)\
    \ — where a model issues a batch of parallel patches, half of them fail with\n\
    \        # \"Could not find old_string\", and the model summarises the turn claiming\
    \ every file was edited. The\n        # user then has to manually run ``git status``\
    \ to catch the lie. With this footer the truth is\n        # surfaced on every\
    \ turn, so over-claiming is structurally impossible past the model. Gate: only\n\
    \        # applied when a real text response exists for this turn and the user\
    \ didn't interrupt.\n        # Empty/interrupted turns already have other surface\
    \ text that shouldn't be augmented.\n        _failed = getattr(agent, \"_turn_failed_file_mutations\"\
    , None) or {}\n        if _failed and agent._file_mutation_verifier_enabled():\n\
    \            _failed = agent._file_mutations_still_failed(_failed)\n         \
    \   footer = agent._format_file_mutation_failure_footer(_failed)\n           \
    \ if footer:\n                final_response = final_response.rstrip() + \"\\\
    n\\n\" + footer\n    except Exception as _ver_err:\n        logger.debug(\"file-mutation\
    \ verifier footer failed: %s\", _ver_err)\n    return final_response\n\n\n"
  new_block: "def _append_file_mutation_footer(agent, final_response, logger):\n \
    \   \"\"\"File-mutation verifier disabled via patch.\"\"\"\n    return final_response\n\
    \n"
  description: disable-file-mutation-verifier-footer
