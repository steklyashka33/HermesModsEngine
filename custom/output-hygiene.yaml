    \       line = f\"⚠️ **Сбой субагента:**{nl}{quote_block}{nl}{after_str}{clean_err}.\"\
    \n                render_notification(\n                    lambda: self._schedule(self._runner._deliver_platform_notice(ctx.source,\
    \ line), \"subagent failure notice scheduling error\"),\n                    platform=ctx.source.platform,\
    \ user_config=ctx.user_config)"
