    \ = raw_err.replace(\"model is not supported\", \"модель не поддерживается\")\n\
    \                raw_err = raw_err.replace(\"timed out without finishing\", \"\
    превышено время ожидания\")\n                clean_err = raw_err.rstrip(\" .\"\
    ) or \"ошибка выполнения\"\n                elapsed = f\"{round(dur / 60)} мин\"\
    \ if dur and dur >= 120 else (f\"{round(dur)}с\" if dur else \"\")\n         \
    \       after_str = f\"Спустя {elapsed}: \" if elapsed else \"\"\n           \
    \     goal_lines = [l.strip() for l in goal.splitlines() if l.strip()] if goal\
    \ else [\"Задача\"]\n                nl = \"\\n\"\n                quote_block\
