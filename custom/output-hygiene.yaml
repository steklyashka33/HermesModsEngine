- file: gateway/run_turn_persistence.py
  description: Translate failed-turn boundary notices to Russian on user delivery
  old_block: "    def _hmwa_add_failed_turn_notice(self, response, notice):\n    \
    \    \"\"\"Make failed-turn delivery explicit without replacing the provider-specific\
    \ guidance.\"\"\"\n        response = str(response or \"\").strip()\n        return\
    \ f\"{response}\\n\\n{notice}\" if response else notice"
  new_block: "    def _hmwa_add_failed_turn_notice(self, response, notice):\n    \
    \    \"\"\"Make failed-turn delivery explicit without replacing the provider-specific\
    \ guidance.\"\"\"\n        response = str(response or \"\").strip()\n        ru_notice\
    \ = notice\n        if notice == FAILED_TURN_NOTICE:\n            ru_notice =\
    \ \"Запрос не был обработан. Отправьте его ещё раз, если нужно продолжить.\"\n\
    \        elif notice == PARTIAL_FAILED_TURN_NOTICE:\n            ru_notice = \"\
    Ход не был завершён. Часть действий могла выполниться; проверьте результат перед\
    \ повторной отправкой.\"\n        return f\"{response}\\n\\n{ru_notice}\" if response\
    \ else ru_notice"
