- file: gateway/run_turn_progress.py
  old_block: "    def _progress_subagent_notice(self, preview, kwargs: dict) -> None:\n\
    \        \"\"\"Only terminal failure statuses render (same notice rail as credit\
    \ warnings).\"\"\"\n        ctx = self._ctx\n        from gateway.warning_notifications\
    \ import render_notification\n        status = kwargs.get(\"status\")\n      \
    \  try:\n            from tools.delegate_tool import SUBAGENT_FAILURE_STATUSES,\
    \ format_subagent_failure_line\n            if status in SUBAGENT_FAILURE_STATUSES\
    \ and ctx._run_still_current():\n                line = format_subagent_failure_line(\n\
    \                    kwargs.get(\"goal\"), status, error=kwargs.get(\"summary\"\
    ) or preview,\n                    duration_seconds=kwargs.get(\"duration_seconds\"\
    ), failure_reason=kwargs.get(\"failure_reason\"),\n                )"
  new_block: "    def _progress_subagent_notice(self, preview, kwargs: dict) -> None:\n\
    \        \"\"\"Only terminal failure statuses render (same notice rail as credit\
    \ warnings).\"\"\"\n        ctx = self._ctx\n        from gateway.warning_notifications\
    \ import render_notification\n        status = kwargs.get(\"status\")\n      \
    \  try:\n            from tools.delegate_tool import SUBAGENT_FAILURE_STATUSES\n\
    \            if status in SUBAGENT_FAILURE_STATUSES and ctx._run_still_current():\n\
    \                setattr(self._runner, \"_subagent_failure_notified\", True)\n\
    \                goal = str(kwargs.get(\"goal\") or \"\").strip()\n          \
    \      dur = kwargs.get(\"duration_seconds\")\n                raw_err = str(kwargs.get(\"\
