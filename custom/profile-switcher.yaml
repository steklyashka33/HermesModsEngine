tests:
  test_profile_command_registry_and_handler: 'from hermes_cli.commands import COMMAND_REGISTRY

    p = [c for c in COMMAND_REGISTRY if c.name == "profile"][0]

    assert p.subcommands == ("use", "switch", "set", "reset")

    from gateway.slash_commands import GatewaySlashCommandsMixin

    assert hasattr(GatewaySlashCommandsMixin, "_handle_profile_command")

    '
