- file: acp_adapter/server.py
  description: Реестр фоновых задач и логирование необработанных исключений в _schedule_soon
  old_block: "    def _schedule_soon(self, make_coro: Callable[[], Any]) -> None:\n\
    \        \"\"\"Run a notification coroutine right after the current response is\
    \ queued.\"\"\"\n        if not self._conn:\n            return\n        loop\
    \ = asyncio.get_running_loop()\n        loop.call_soon(asyncio.create_task, make_coro())"
  new_block: "    def _schedule_soon(self, make_coro: Callable[[], Any]) -> None:\n\
    \        \"\"\"Run a notification coroutine right after the current response is\
    \ queued.\"\"\"\n        if not self._conn:\n            return\n        tasks\
    \ = getattr(self, \"_background_tasks\", None)\n        if tasks is None:\n  \
    \          tasks = self._background_tasks = set()\n        loop = asyncio.get_running_loop()\n\
    \n        def _spawn() -> None:\n            try:\n                task = asyncio.create_task(make_coro())\n\
    \            except Exception:\n                logger.exception(\"Failed to spawn\
    \ ACP background task\")\n                return\n            tasks.add(task)\n\
    \n            def _on_done(t: asyncio.Task) -> None:\n                tasks.discard(t)\n\
    \                if not t.cancelled() and t.exception() is not None:\n       \
    \             logger.error(\"ACP background task failed: %s\", t.exception(),\
    \ exc_info=t.exception())\n\n            task.add_done_callback(_on_done)\n\n\
    \        loop.call_soon(_spawn)"
