- file: plugins/web/keyless_mcp.py
  description: Сквозной дедлайн (45.0с) для цикла обхода кольца провайдеров Keyless
    MCP
  old_block: "def _walk_ring(name: str, kind: str, call, throttled) -> tuple:\n  \
    \  \"\"\"Call each vendor from :func:`_ring_order` until a result is not ``throttled``.\n\
    \    Returns ``(order, vendor, result, exhausted)``; ``order`` is empty (result\
    \ None)\n    when every vendor is pinned paid.\"\"\"\n    order = _ring_order(name)\n\
    \    vendor, result = None, None\n    for i, vendor in enumerate(order):\n   \
    \     result = call(vendor)\n        if not throttled(result):\n            return\
    \ order, vendor, result, False\n        if i + 1 < len(order):\n            logger.info(\"\
    keyless %s %s unavailable; failing over to %s\", vendor, kind, order[i + 1])\n\
    \    return order, vendor, result, True"
  new_block: "def _walk_ring(name: str, kind: str, call, throttled, timeout: Optional[float]\
    \ = None) -> tuple:\n    \"\"\"Call each vendor from :func:`_ring_order` until\
    \ a result is not ``throttled``\n    or the overall ring timeout is exceeded.\n\
    \    Returns ``(order, vendor, result, exhausted)``; ``order`` is empty (result\
    \ None)\n    when every vendor is pinned paid.\"\"\"\n    import os\n    import\
    \ time\n    if timeout is None:\n        try:\n            timeout = float(os.environ.get(\"\
    HERMES_KEYLESS_RING_TIMEOUT\", \"45.0\"))\n        except (TypeError, ValueError):\n\
    \            timeout = 45.0\n    order = _ring_order(name)\n    vendor, result\
    \ = None, None\n    deadline = time.monotonic() + timeout\n    for i, vendor in\
    \ enumerate(order):\n        if i > 0 and time.monotonic() >= deadline:\n    \
    \        logger.warning(\"keyless %s ring walk deadline (%.1fs) exceeded before\
    \ %s; stopping failover\", kind, timeout, vendor)\n            break\n       \
    \ result = call(vendor)\n        if not throttled(result):\n            return\
    \ order, vendor, result, False\n        if i + 1 < len(order):\n            if\
    \ time.monotonic() >= deadline:\n                logger.warning(\"keyless %s ring\
    \ walk deadline (%.1fs) exceeded after %s; stopping failover\", kind, timeout,\
    \ vendor)\n                break\n            logger.info(\"keyless %s %s unavailable;\
    \ failing over to %s\", vendor, kind, order[i + 1])\n    return order, vendor,\
    \ result, True"
