id: network-resilience
name: Comprehensive Network Resilience & Message Delivery Guard
description: 'Unified network resilience: LLM stream retry, 60s connect timeout, None
  base read timeout (SSE streaming preserved), Gemini reasoning floors (300s), Telegram
  media/sticker retry, Telegram message drop prevention, TUI WebSocket 5s teardown
  timeout, ACP prompt preservation, and MCP failover ring 45s deadline'
version: 1.3.0
author: Hermes Admin
enabled: true
tests:
  test_telegram_adapter_resilience: 'from plugins.platforms.telegram.adapter import
    TelegramAdapter

    assert hasattr(TelegramAdapter, "_ext_from_path")

    '
  test_chat_completion_helpers: 'import agent.chat_completion_helpers

    '
  test_keyless_mcp: 'import plugins.web.keyless_mcp

    '
  test_reasoning_timeouts: 'from agent.reasoning_timeouts import get_reasoning_stale_timeout_floor

    assert get_reasoning_stale_timeout_floor("cpa/gemini-3.8-high") == 300.0

    assert get_reasoning_stale_timeout_floor("gemini") == 300.0

    '
  test_bootstrap_timeout: 'from agent.process_bootstrap import build_keepalive_http_client

    client = build_keepalive_http_client("https://api.example.com/v1", verify=False)

    assert client.timeout.connect == 60.0

    assert client.timeout.read is None

    '
  test_stream_timeouts_stale_floor: 'from types import SimpleNamespace

    from agent.chat_completion_helpers import _StreamingCall

    agent = SimpleNamespace(provider="antigravity", model="cpa/gemini-3.8-high", base_url="https://api.example.com/v1")

    call = _StreamingCall(agent, {}, None)

    call._stream_stale_timeout = 300.0

    base, read, conn = call._stream_timeouts()

    assert read >= 300.0, f"Expected read >= 300.0, got {read}"

    assert conn == 60.0, f"Expected conn == 60.0, got {conn}"

    '
