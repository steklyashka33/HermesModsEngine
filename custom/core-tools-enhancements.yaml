- file: tools/registry.py
  description: Add check_fn probe timeout constant and bounded executor
  old_block: "def _run_check_fn_uncached(fn: Callable) -> bool:\n    \"\"\"Run an\
    \ availability check without cache/grace handling.\"\"\"\n    from agent.secret_scope\
    \ import UnscopedSecretError, current_secret_scope\n    try:\n        return bool(fn())"
  new_block: "_CHECK_FN_TIMEOUT_SECONDS = 2.5\n\ndef _invoke_check_fn(fn: Callable,\
    \ timeout: Optional[float] = None) -> bool:\n    \"\"\"Run check_fn probe with\
    \ a bounded timeout and propagated contextvars.\"\"\"\n    import contextvars\n\
    \    effective_timeout = _CHECK_FN_TIMEOUT_SECONDS if timeout is None else timeout\n\
    \    res: list[bool] = []\n    exc: list[BaseException] = []\n    ctx = contextvars.copy_context()\n\
    \n    def _worker():\n        try:\n            if inspect.iscoroutinefunction(fn):\n\
    \                import asyncio\n                res.append(bool(asyncio.run(fn())))\n\
    \            else:\n                val = fn()\n                if inspect.iscoroutine(val):\n\
    \                    import asyncio\n                    res.append(bool(asyncio.run(val)))\n\
    \                else:\n                    res.append(bool(val))\n        except\
    \ BaseException as e:\n            exc.append(e)\n\n    thread = threading.Thread(target=ctx.run,\
    \ args=(_worker,), name=f\"check-fn-{_fn_label(fn)}\", daemon=True)\n    thread.start()\n\
    \    thread.join(timeout=effective_timeout)\n    if thread.is_alive():\n     \
    \   raise TimeoutError(f\"check_fn {_fn_label(fn)} timed out after {effective_timeout:.1f}s\"\
    )\n    if exc:\n        raise exc[0]\n    return res[0] if res else False\n\n\
    def _run_check_fn_uncached(fn: Callable) -> bool:\n    \"\"\"Run an availability\
    \ check without cache/grace handling.\"\"\"\n    from agent.secret_scope import\
    \ UnscopedSecretError, current_secret_scope\n    try:\n        return bool(_invoke_check_fn(fn))"
