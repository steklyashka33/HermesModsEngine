- file: tools/delegate_tool.py
  description: Helper _find_resumable_subagent_context and handling action='resume'
    in delegate_task
  old_block: "def delegate_task(\n    goal: Optional[str] = None, context: Optional[str]\
    \ = None, tasks: Optional[list[dict[str, Any]]] = None,\n    max_iterations: Optional[int]\
    \ = None, role: Optional[str] = None, background: Optional[bool] = None,\n   \
    \ output_schema: Optional[dict[str, Any]] = None, images: Optional[list[str]]\
    \ = None, action: Optional[str] = None,\n    subagent_id: Optional[str] = None,\
    \ message: Optional[str] = None, parent_agent=None,\n    credentials_cfg: Optional[dict[str,\
    \ Any]] = None,\n) -> str:\n    \"\"\"Spawn child agents (single ``goal`` or ``tasks=[...]``\
    \ batch) or control running ones. ``action``\n    list/steer/stop run synchronously\
    \ and bypass the pause gate, depth limit and async dispatch. ``role`` is legacy\n\
    \    (per-task beats top-level; capability is depth-derived). Returns JSON with\
    \ one results entry per task, or a\n    dispatch handle when running in the background.\"\
    \"\"\n    if parent_agent is None:\n        return tool_error(\"delegate_task\
    \ requires a parent agent context.\")\n\n    normalized_action = (action or \"\
    \").strip().lower()\n    if normalized_action in _CONTROL_ACTIONS:\n        return\
    \ _handle_control_action(normalized_action, subagent_id, message, parent_agent)\n\
    \    if normalized_action and normalized_action != \"spawn\":\n        return\
    \ tool_error(f\"Unknown action '{action}'. Use spawn (default), list, steer, or\
    \ stop.\")"
  new_block: "_pending_resumes = {}\ndef _find_resumable_subagent_context(sid: str,\
