name: Core Tools Enhancements
version: 1.3.0
description: 'Comprehensive core tools enhancements: literal flag -F in search_files,
  atomic write_file, safe error handling in browser_vision and vision_analyze'
tests:
  test_delegate_task_resume_payload: 'from tools.delegate_tool_dispatch import _dispatched_payload

    from types import SimpleNamespace

    c = SimpleNamespace(_subagent_id=''child-1'', _resumed_from_subagent_id=''parent-orig-id'')

    b = SimpleNamespace(task_list=[{''goal'': ''test''}], children=[(0, {}, c)], refused=None,
    live_paths=[], group=''default'', live_deleg_id=None)

    payload = _dispatched_payload(b, [(b, ''uid-1'')])

    assert payload.get(''resumed_from'') == ''parent-orig-id''

    '
  test_search_files_literal_signature: 'from tools.file_operations import ShellFileOperations,
    FileOperations

    import inspect

    sig = inspect.signature(ShellFileOperations.search)

    assert "literal" in sig.parameters, "ShellFileOperations.search must have literal
    param"

    assert sig.parameters["literal"].default is False

    sig_fo = inspect.signature(FileOperations.search)

    assert "literal" in sig_fo.parameters, "FileOperations.search must have literal
    param"

    '
  test_search_tool_literal_execution: 'import os

    from pathlib import Path

    from tools.file_tools import search_tool

    import json

    mods_path = str(Path(os.environ.get("HERMES_MODS_DIR", Path(os.environ.get("HERMES_HOME",
    Path.home() / ".hermes")) / "mods")))

    res_str = search_tool(pattern="def main", path=mods_path, limit=5, literal=True)

    res = json.loads(res_str)

    assert "error" not in res, f"search_tool failed: {res}"

    '
  test_write_file_create_only: 'import inspect

    from tools.file_tools import write_file_tool, WRITE_FILE_SCHEMA

    sig = inspect.signature(write_file_tool)

    assert ''create_only'' in sig.parameters

    assert ''create_only'' in WRITE_FILE_SCHEMA[''parameters''][''properties'']

    '
  test_delegate_task_resume_schema: 'from tools.delegate_tool import DELEGATE_TASK_SCHEMA

    action_prop = DELEGATE_TASK_SCHEMA["parameters"]["properties"]["action"]

    assert "resume" in action_prop.get("enum", [])

    assert "resume" in action_prop.get("description", "")

    assert "resume" in DELEGATE_TASK_SCHEMA["parameters"]["properties"]["subagent_id"]["description"]

    '
  test_delegate_task_resume_validation: "from tools.delegate_tool import delegate_task\n\
    class MockParent:\n    pass\nparent = MockParent()\nres = delegate_task(action=\"\
    resume\", parent_agent=parent)\nassert \"requires 'subagent_id'\" in res or \"\
    requires subagent_id\" in res\nres2 = delegate_task(action=\"resume\", subagent_id=\"\
    sa-nonexistent-99999\", parent_agent=parent)\nassert \"No completed subagent found\"\
    \ in res2 or \"error\" in res2.lower()\n"
  test_delegate_task_resume_discovery: "from tools.delegate_tool import _find_resumable_subagent_context\n\
    from tools.delegate_tool_registry import _recent_subagents, _active_subagents_lock\n\
    with _active_subagents_lock:\n    _recent_subagents[\"sa-test-resume-discovery\"\
    ] = {\n        \"goal\": \"Test goal for resume\",\n        \"context\": \"Test\
    \ context\",\n        \"model\": \"test-model-resume\",\n        \"delegation_id\"\
    : \"deleg_test_res\",\n        \"session_id\": \"sess_test_res\",\n    }\nctx,\
    \ err = _find_resumable_subagent_context(\"sa-test-resume-discovery\")\nassert\
    \ err is None\nassert ctx is not None\nassert ctx[\"goal\"] == \"Test goal for\
    \ resume\"\nassert ctx[\"model\"] == \"test-model-resume\"\n"
