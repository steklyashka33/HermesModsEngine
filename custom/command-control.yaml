tests:
  test_telegram_menu_filtering_and_mod_commands: 'from hermes_cli.config import _OPEN_DICT_TOP_LEVEL_KEYS

    assert "mods" in _OPEN_DICT_TOP_LEVEL_KEYS

    from hermes_cli.commands_platforms import telegram_menu_commands, _prioritize_telegram_menu_candidates,
    _collect_mod_commands

    from hermes_cli.commands import COMMAND_REGISTRY

    assert any(c.name == "fast" for c in COMMAND_REGISTRY)

    assert any(c.name == "egress" for c in COMMAND_REGISTRY)

    menu, _ = telegram_menu_commands(100)

    menu_names = [n for n, _ in menu]

    assert "fast" not in menu_names

    assert "egress" not in menu_names

    assert "codex_runtime" not in menu_names

    assert "help" in menu_names

    '
