tests:
  test_queue_consumption_suite: "import subprocess\nres = subprocess.run([\n    \"\
    /usr/local/lib/hermes-agent/venv/bin/pytest\", \"-q\",\n    \"/usr/local/lib/hermes-agent/tests/gateway/test_queue_consumption.py\"\
    \n], capture_output=True, text=True)\nassert res.returncode == 0, res.stdout +\
    \ res.stderr\n"
  test_same_sender_isolation_contract: 'from unittest.mock import MagicMock

    from gateway.config import Platform

    ev_u1 = MagicMock(source=MagicMock(user_id="u1", platform=Platform.TELEGRAM))

    ev_u2 = MagicMock(source=MagicMock(user_id="u2", platform=Platform.TELEGRAM))

    assert getattr(ev_u1.source, "user_id") != getattr(ev_u2.source, "user_id")

    '
