- file: agent/turn_recovery.py
  description: Immediate turn termination on long cooldown or cooling down in free_tier_cooldown_ends_turn
  old_block: "def free_tier_cooldown_ends_turn(agent: Any, api_error: Exception, base_url:\
    \ Any) -> bool:\n    \"\"\"True when an attended session on the free model meets\
    \ a cooldown longer than a person\n    sits through. The free tier's pause is\
    \ service-wide: a 600 s retry met a second 429 while its\n    1069 s window ran,\
    \ so the caller ends the attempt cycle now (fallback, or the reset time and\n\
    \    the sign-in / model doors). Every other provider, and every unattended run\
    \ (cron, messaging,\n    ``hermes chat -q``), waits out its ``Retry-After``: a\
    \ paid bucket reopens on time, and\n    ``fallback.min_switch_reset_seconds``\
    \ relies on that wait.\"\"\"\n    from agent.retry_utils import LIVE_RETRY_WAIT_CAP_S,\
    \ provider_retry_after_seconds\n    from agent.session_source import is_attended\n\
    \    from hermes_cli.anon_auth import on_free_model\n    if not (on_free_model(agent,\
    \ base_url) and is_attended(agent)):\n        return False\n    cooldown = provider_retry_after_seconds(api_error)\n\
    \    return cooldown is not None and cooldown > LIVE_RETRY_WAIT_CAP_S\n"
