id: subscription-limit-notice
name: Subscription Limit Concise Notice & No-Retry Guard
description: Concise subscription limit reached notice with reset timer and no-retry
  guard for 429/503 cooldowns
version: 1.3.0
author: Hermes Admin
enabled: true
i18n:
  en:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Concise subscription limit reached notice with reset timer and no-retry
      guard for 429/503 cooldowns
    subscription_limit:
      notice: 'Subscription limit reached, resets in {time}. Switch model: /model
        or wait.'
      unknown_time: some time
  ru:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Лаконичное сообщение об исчерпании лимита подписки с таймером сброса
      (429/503 / cooling down / reset after) без слепых повторных попыток
    subscription_limit:
      notice: 'Лимит подписки исчерпан, сброс через {time}. Поменять модель: /model
        или дождитесь.'
      unknown_time: некоторое время
  es:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Aviso conciso de límite de suscripción alcanzado con temporizador
      de reinicio y protección sin reintentos para enfriamientos 429/503
    subscription_limit:
      notice: 'Límite de suscripción alcanzado, se reinicia en {time}. Cambie de modelo:
        /model o espere.'
      unknown_time: un momento
  fr:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Notification concise de limite d'abonnement atteinte avec minuteur
      de réinitialisation et protection sans nouvelle tentative pour les refroidissements
      429/503
    subscription_limit:
      notice: 'Limite d''abonnement atteinte, réinitialisation dans {time}. Changez
        de modèle : /model ou patientez.'
      unknown_time: un certain temps
  zh:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: 简洁的订阅额度耗尽通知，带有重置计时器和针对429/503冷却的免重试保护
    subscription_limit:
      notice: 已达到订阅额度限制，将在 {time} 后重置。更换模型：/model 或稍后重试。
      unknown_time: 稍后
  ar:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: إشعار موجز بالوصول إلى حد الاشتراك مع مؤقت لإعادة الضبط وحماية ضد
      إعادة المحاولة لفترات التهدئة 429/503
    subscription_limit:
      notice: 'تم استنفاد حد الاشتراك، سيُعاد التعيين خلال {time}. غيّر النموذج: /model
        أو انتظر.'
      unknown_time: بعض الوقت
  de:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Präziser Hinweis bei erreichtem Abonnementlimit mit Reset-Timer und
      No-Retry-Schutz für 429/503-Abkühlphasen
    subscription_limit:
      notice: 'Abonnementlimit erreicht, Reset in {time}. Modell wechseln: /model
        oder warten.'
      unknown_time: einiger Zeit
  pt:
    name: Subscription Limit Concise Notice & No-Retry Guard
    description: Aviso conciso de limite de assinatura atingido com temporizador de
      redefinição e proteção sem repetição para períodos de resfriamento 429/503
    subscription_limit:
      notice: 'Limite de assinatura atingido, reinicia em {time}. Troque de modelo:
        /model ou aguarde.'
      unknown_time: algum tempo
tests:
  test_subscription_limit_enum: 'from agent.error_classifier import FailoverReason

    assert hasattr(FailoverReason, "subscription_limit")

    assert FailoverReason.subscription_limit.value == "subscription_limit"

    '
  test_classify_unavailable_reset_after: 'from agent.error_classifier import classify_api_error,
    FailoverReason

    exc = Exception("HTTP 503: [codex/gpt-6-sol] Unavailable (reset after 1h 44m 7s)")

    c = classify_api_error(exc)

    assert c.reason == FailoverReason.subscription_limit

    assert c.retryable is False

    assert c.should_fallback is False

    assert c.error_context.get("reset_window_str") == "1h 44m 7s"

    '
  test_classify_503_cooldown: 'from agent.error_classifier import classify_api_error,
    FailoverReason

    exc = Exception("503 Service Unavailable")

    setattr(exc, "status_code", 503)

    c = classify_api_error(exc)

    assert c.reason == FailoverReason.overloaded

    assert c.retryable is True

    exc_with_header = Exception("503 Service Unavailable")

    setattr(exc_with_header, "status_code", 503)

    setattr(exc_with_header, "response", type("Resp", (), {"headers": {"retry-after":
    "120"}})())

    c2 = classify_api_error(exc_with_header)

    assert c2.reason == FailoverReason.subscription_limit

    assert c2.retryable is False

    assert c2.should_fallback is False

    assert c2.error_context.get("reset_window_str") == "2m"

    '
  test_classify_429_cooling_down_header: 'from agent.error_classifier import classify_api_error,
    FailoverReason

    exc = Exception("HTTP 429: All credentials for model gpt-6.1-sol are cooling down")

    setattr(exc, "status_code", 429)

    setattr(exc, "response", type("Resp", (), {"headers": {"retry-after": "84720"}})())

    c = classify_api_error(exc)

    assert c.reason == FailoverReason.subscription_limit

    assert c.retryable is False

    assert c.should_fallback is False

    assert c.error_context.get("reset_window_str") == "23h 32m"

    '
  test_classify_429_model_cooldown_error_payload: 'from agent.error_classifier import
    classify_api_error, FailoverReason

    exc = Exception("Error code: 429 - {''error'': {''message'': ''All credentials
    for model gemini-3.8-flash-high are cooling down'', ''type'': ''rate_limit_error'',
    ''code'': ''model_cooldown'', ''model'': ''gemini-3.8-flash-high'', ''reset_seconds'':
    43, ''retry_after'': ''2026-09-06T15:57:21.983Z'', ''credentials_cooling'': 1}}")

    c = classify_api_error(exc)

    assert c.reason == FailoverReason.subscription_limit

    assert c.retryable is False

    assert c.should_fallback is False

    assert c.error_context.get("reset_window_str") == "43s"

    '
  test_classify_429_short_burst_stays_rate_limit: 'from agent.error_classifier import
    classify_api_error, FailoverReason

    exc = Exception("429 Too Many Requests")

    setattr(exc, "status_code", 429)

    setattr(exc, "response", type("Resp", (), {"headers": {"retry-after": "2"}})())

    c = classify_api_error(exc)

    assert c.reason == FailoverReason.rate_limit

    assert c.retryable is True

    '
  test_turn_failure_copy_russian: "import os\nfrom types import SimpleNamespace\n\
    from agent.error_classifier import FailoverReason\nfrom agent.turn_failure_copy\
    \ import nonretryable_copy, exhausted_copy\nfrom agent.i18n import reset_language_cache,\
    \ t\nos.environ[\"HERMES_LANGUAGE\"] = \"ru\"\nreset_language_cache()\n\nc = SimpleNamespace(\n\
    \    reason=FailoverReason.subscription_limit,\n    error_context={\"reset_window_str\"\
    : \"1h 44m 7s\"}\n)\ncopy1 = nonretryable_copy(c, provider=\"gpt\", model=\"gpt-6.1-sol\"\
    , summary=\"Unavailable (reset after 1h 44m 7s)\")\nassert copy1 == \"Лимит подписки\
    \ исчерпан, сброс через 1h 44m 7s. Поменять модель: /model или дождитесь.\"\n\n\
    c2 = SimpleNamespace(\n    reason=FailoverReason.subscription_limit,\n    error_context={\"\
    reset_window_str\": \"23h 32m\"}\n)\ncopy2 = nonretryable_copy(c2, provider=\"\
    gpt\", model=\"gpt-6.1-sol\", summary=\"HTTP 429: All credentials for model gpt-6.1-sol\
    \ are cooling down\")\nassert copy2 == \"Лимит подписки исчерпан, сброс через\
    \ 23h 32m. Поменять модель: /model или дождитесь.\"\n\ncopy3 = exhausted_copy(\n\
    \    FailoverReason.subscription_limit.value,\n    label=\"GPT\",\n    attempts=3,\n\
    \    summary=\"HTTP 429: All credentials for model gpt-6.1-sol are cooling down\"\
    ,\n    reset_seconds=84720\n)\nassert copy3 == \"Лимит подписки исчерпан, сброс\
    \ через 23h 32m. Поменять модель: /model или дождитесь.\"\n\nassert t(\"subscription_limit.notice\"\
    , lang=\"ru\", time=\"1h 44m 7s\") == \"Лимит подписки исчерпан, сброс через 1h\
    \ 44m 7s. Поменять модель: /model или дождитесь.\"\n"
  test_turn_failure_copy_english: "import os\nfrom types import SimpleNamespace\n\
