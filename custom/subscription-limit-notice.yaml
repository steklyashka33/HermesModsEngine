- file: agent/error_classifier.py
  description: Subscription limit verdict helper and _STAGES registration
  old_block: "def _by_status(c: _Ctx) -> Optional[Verdict]:\n    \"\"\"HTTP status\
    \ code with message-aware refinement (unlisted 4xx/5xx → generic).\"\"\"\n   \
    \ status = c.status_code\n    if status is None:\n        return None\n    default\
    \ = _V_FORMAT_ERROR if 400 <= status < 500 else _V_SERVER_ERROR if 500 <= status\
    \ < 600 else None\n    return _STATUS_HANDLERS[status](c) if status in _STATUS_HANDLERS\
    \ else default\n\n\n# Stage order: plugin hooks → the provider's own profile hook\
    \ → provider-specific special cases →\n# HTTP status → MoA shapes → structured\
    \ error code → message patterns → SSL → disconnect +\n# large session → transport\
    \ types → unknown (retryable with backoff).\n_STAGES: Sequence[Callable[[_Ctx],\
    \ Optional[Verdict]]] = (\n    _plugin_verdict, _profile_verdict, _provider_special_cases,\
    \ _by_status, _moa_special_cases,\n    _by_error_code, _by_message, _by_transport,\n\
    )\n"
  new_block: "_RESET_HINT_PATTERNS = (\n    re.compile(r\"reset(?:s)?\\s+after\\s+([^\\\
    ),\\n\\\"]+)\", re.IGNORECASE),\n    re.compile(r\"resets?\\s+in\\s+~?([^\\),\\\
    .\\n\\\"]+)\", re.IGNORECASE),\n    re.compile(r\"will\\s+reset\\s+after\\s+([^\\\
    ),\\n\\\"]+)\", re.IGNORECASE),\n    re.compile(r\"cooling\\s+down\\s*\\(([^)]+)\\\
    )\", re.IGNORECASE),\n)\n\n\ndef _format_cooldown_human(total_sec: float) -> str:\n\
    \    import math\n    total = max(0, int(math.ceil(total_sec)))\n    h = total\
    \ // 3600\n    m = (total % 3600) // 60\n    s = total % 60\n    parts = []\n\
    \    if h > 0:\n        parts.append(f\"{h}h\")\n        if m > 0:\n         \
    \   parts.append(f\"{m}m\")\n    elif m > 0:\n        parts.append(f\"{m}m\")\n\
    \        if s > 0:\n            parts.append(f\"{s}s\")\n    else:\n        parts.append(f\"\
    {s}s\")\n    return \" \".join(parts)\n\n\ndef _parse_duration_to_seconds(text:\
    \ str) -> Optional[float]:\n    total = 0.0\n    matched = False\n    clean_text\
    \ = text.lstrip(\"~\").strip()\n    m_h = re.search(r\"(\\d+(?:\\.\\d+)?)\\s*(?:h|hr|hrs|hour|hours)\"\
    , clean_text, re.IGNORECASE)\n    if m_h:\n        total += float(m_h.group(1))\
    \ * 3600\n        matched = True\n    m_m = re.search(r\"(\\d+(?:\\.\\d+)?)\\\
    s*(?:m|min|mins|minute|minutes)\", clean_text, re.IGNORECASE)\n    if m_m:\n \
    \       total += float(m_m.group(1)) * 60\n        matched = True\n    m_s = re.search(r\"\
    (\\d+(?:\\.\\d+)?)\\s*(?:s|sec|secs|second|seconds)\", clean_text, re.IGNORECASE)\n\
    \    if m_s:\n        total += float(m_s.group(1))\n        matched = True\n \
    \   if not matched:\n        m_num = re.search(r\"^(\\d+(?:\\.\\d+)?)$\", clean_text)\n\
    \        if m_num:\n            return float(m_num.group(1))\n        return None\n\
    \    return total\n\n\ndef _subscription_limit_verdict(c: _Ctx) -> Optional[Verdict]:\n\
    \    \"\"\"Detect subscription quota exhaustion: 'Unavailable (reset after <X>)',\
    \ 429/503 with cooldown, or 'cooling down'.\"\"\"\n    raw_text = f\"{str(c.error)}\
    \ {c.msg}\"\n    raw_lower = raw_text.lower()\n    status = c.status_code if c.status_code\
    \ is not None else getattr(c, \"status_code\", None)\n    if status is None:\n\
    \        m_stat = re.search(r\"\\b(429|503)\\b\", raw_text)\n        if m_stat:\n\
    \            status = int(m_stat.group(1))\n\n    x_val = None\n    reset_sec\
    \ = None\n\n    for pat in _RESET_HINT_PATTERNS:\n        m = pat.search(raw_text)\n\
    \        if m:\n            matched_str = m.group(1).strip().lstrip(\"~\").strip()\n\
    \            parsed = _parse_duration_to_seconds(matched_str)\n            if\
    \ parsed is not None and parsed > 0:\n                reset_sec = parsed\n   \
    \             x_val = matched_str\n                break\n\n    if reset_sec is\
    \ None:\n        for payload in (p for p in (c.body, _error_obj(c.body) if \"\
    _error_obj\" in globals() else None) if isinstance(p, dict)):\n            for\
    \ k in (\"reset_seconds\", \"resets_in_seconds\", \"retry_after\", \"reset_after\"\
    ):\n                val = payload.get(k)\n                if val not in (None,\
    \ \"\"):\n                    if isinstance(val, (int, float)):\n            \
    \            reset_sec = float(val)\n                        break\n         \
    \           elif isinstance(val, str):\n                        try:\n       \
    \                     reset_sec = float(val)\n                            break\n\
    \                        except ValueError:\n                            parsed\
    \ = _parse_duration_to_seconds(val)\n                            if parsed is\
    \ not None and parsed > 0:\n                                reset_sec = parsed\n\
    \                                break\n            if reset_sec is not None:\n\
    \                break\n\n    if reset_sec is None:\n        m_sec = re.search(r\"\
    (?:reset_seconds|resets_in_seconds)[\\\"':\\s=]+(\\d+(?:\\.\\d+)?)\", raw_text,\
    \ re.IGNORECASE)\n        if m_sec:\n            try:\n                reset_sec\
    \ = float(m_sec.group(1))\n            except (ValueError, TypeError):\n     \
    \           pass\n\n    if reset_sec is None:\n        reset_sec = _rate_limit_reset_seconds(c.msg,\
    \ c.body, c.headers)\n\n    has_cooldown_keyword = any(kw in raw_lower for kw\
    \ in (\n        \"cooling down\", \"cooldown\", \"model_cooldown\", \"all credentials\
    \ for model\",\n        \"reset after\", \"resets in\", \"quota\", \"exhausted\"\
    , \"subscription\"\n    )) or getattr(c, \"code\", \"\") == \"model_cooldown\"\
    \n\n    is_sub_limit = False\n    if x_val is not None:\n        is_sub_limit\
    \ = True\n    elif \"model_cooldown\" in raw_lower or \"cooling down\" in raw_lower\
    \ or \"all credentials for model\" in raw_lower or getattr(c, \"code\", \"\")\
    \ == \"model_cooldown\":\n        is_sub_limit = True\n    elif status in (429,\
    \ 503):\n        if has_cooldown_keyword:\n            is_sub_limit = True\n \
    \       elif reset_sec is not None and reset_sec >= 60:\n            is_sub_limit\
    \ = True\n\n    if is_sub_limit:\n        if reset_sec and reset_sec > 0:\n  \
    \          if not x_val:\n                x_val = _format_cooldown_human(reset_sec)\n\
    \        else:\n            x_val = x_val or None\n\n        return {\n      \
    \      \"reason\": FailoverReason.subscription_limit,\n            \"retryable\"\
    : False,\n            \"should_fallback\": False,\n            \"should_compress\"\
    : False,\n            \"should_rotate_credential\": False,\n            \"error_context\"\
    : {\n                \"reset_window_str\": x_val,\n                \"reset_at\"\
    : time.time() + reset_sec if reset_sec else None,\n            },\n        }\n\
    \    return None\n\n\ndef _by_status(c: _Ctx) -> Optional[Verdict]:\n    \"\"\"\
    HTTP status code with message-aware refinement (unlisted 4xx/5xx → generic).\"\
    \"\"\n    status = c.status_code\n    if status is None:\n        return None\n\
    \    default = _V_FORMAT_ERROR if 400 <= status < 500 else _V_SERVER_ERROR if\
    \ 500 <= status < 600 else None\n    return _STATUS_HANDLERS[status](c) if status\
    \ in _STATUS_HANDLERS else default\n\n\n# Stage order: plugin hooks → the provider's\
    \ own profile hook → provider-specific special cases →\n# HTTP status → MoA shapes\
    \ → structured error code → message patterns → SSL → disconnect +\n# large session\
    \ → transport types → unknown (retryable with backoff).\n_STAGES: Sequence[Callable[[_Ctx],\
    \ Optional[Verdict]]] = (\n    _subscription_limit_verdict,\n    _plugin_verdict,\
    \ _profile_verdict, _provider_special_cases, _by_status, _moa_special_cases,\n\
    \    _by_error_code, _by_message, _by_transport,\n)\n"
