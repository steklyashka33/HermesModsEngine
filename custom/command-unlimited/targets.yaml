  new_block: "def _get_unlimited_limits() -> tuple[int, int]:\n    \"\"\"Read per-profile\
    \ unlimited caps; delegation.unlimited overrides root unlimited.\"\"\"\n    import\
    \ os\n    if os.environ.get(\"HERMES_IGNORE_USER_CONFIG\") == \"1\":\n       \
    \ try:\n            from cli import CLI_CONFIG\n            config = CLI_CONFIG\n\
    \        except Exception:\n            config = {}\n    else:\n        try:\n\
    \            from hermes_cli.config import load_config_readonly\n            config\
    \ = load_config_readonly()\n        except Exception:\n            config = {}\n\
    \    if not isinstance(config, dict):\n        config = {}\n    delegation = config.get(\"\
    delegation\")\n    nested = delegation.get(\"unlimited\") if isinstance(delegation,\
    \ dict) else None\n    root = config.get(\"unlimited\")\n    values = nested if\
    \ isinstance(nested, dict) else root if isinstance(root, dict) else {}\n    def\
    \ positive_int(name: str, default: int) -> int:\n        try:\n            value\
    \ = int(values.get(name, default))\n            if value < 1:\n              \
    \  raise ValueError(name)\n            return value\n        except (TypeError,\
    \ ValueError):\n            return default\n    return positive_int(\"max_concurrent_children\"\
    , 10), positive_int(\"max_spawn_depth\", 2)\n\n\ndef _is_session_unlimited() ->\
    \ bool:\n    try:\n        from tools.approval_context import get_current_session_key\n\
    \        key = get_current_session_key(default=\"\")\n        if key:\n      \
    \      from hermes_constants import get_hermes_home\n            import sqlite3,\
    \ json\n            db_path = get_hermes_home() / \"state.db\"\n            if\
    \ db_path.exists():\n                with sqlite3.connect(db_path, timeout=1.0)\
    \ as conn:\n                    cur = conn.cursor()\n                    cur.execute(\"\
    SELECT entry_json FROM gateway_routing WHERE session_key = ? LIMIT 1;\", (key,))\n\
    \                    row = cur.fetchone()\n                    if row and row[0]:\n\
    \                        entry = json.loads(row[0])\n                        if\
    \ bool(entry.get(\"metadata\", {}).get(\"unlimited_mode\", False)):\n        \
    \                    return True\n                    try:\n                 \
    \       cur.execute(\"SELECT origin_json FROM sessions WHERE id = ? OR session_key\
    \ = ? LIMIT 1;\", (key, key))\n                        srow = cur.fetchone()\n\
    \                        if srow and srow[0]:\n                            sdata\
    \ = json.loads(srow[0]) if isinstance(srow[0], str) else srow[0]\n           \
    \                 if isinstance(sdata, dict) and bool(sdata.get(\"unlimited_mode\"\
    , False)):\n                                return True\n                    except\
    \ Exception:\n                        pass\n    except Exception:\n        pass\n\
    \    return False\n\n\ndef _get_max_concurrent_children() -> int:\n    \"\"\"\
    delegation.max_concurrent_children > DELEGATION_MAX_CONCURRENT_CHILDREN env >\
    \ 10.\n\n    Floor of 1 is the only bound enforced; there is no ceiling.\n   \
    \ \"\"\"\n    if _is_session_unlimited():\n        unlimited_children, _ = _get_unlimited_limits()\n\
    \        return unlimited_children"
