name: Telegram Quiet Notifications
version: 2.3.0
description: 'Quiet-first Telegram notification policy: mute routine slash command
  replies and topic seeds, preserve audible alerts for urgent events'
dependencies:
- telegram-ux
- output-hygiene
config:
  audible_commands:
    type: bool
    default: false
    description: 'Enable notification sound for slash command replies (default: false
      — quiet mode)'
tests:
  test_quiet_notifications_default_mute: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    res = adapter._notification_kwargs({})

    assert res == {''disable_notification'': True}

    '
  test_quiet_notifications_audible_turn_final: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    res = adapter._notification_kwargs({''agent_turn_final'': True})

    assert res == {}

    '
  test_quiet_notifications_force_notify: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    res = adapter._notification_kwargs({''force_notify'': True})

    assert res == {}

    '
  test_quiet_notifications_command_reply_safe: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    adapter._audible_commands = False

    res = adapter._notification_kwargs({''is_command_reply'': True, ''command'': ''/close''})

    assert res == {''disable_notification'': True}

    res = adapter._notification_kwargs({''is_command_reply'': True, ''command'': None})

    assert res == {''disable_notification'': True}

    adapter._audible_commands = True

    res = adapter._notification_kwargs({''is_command_reply'': True, ''command'': ''voice''})

    assert res == {}

    adapter._audible_commands = None

    res = adapter._notification_kwargs({''is_command_reply'': True, ''command'': ''status''})

    assert res == {''disable_notification'': True}

    '
  test_quiet_notifications_none_and_non_dict_metadata: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    assert adapter._notification_kwargs(None) == {''disable_notification'': True}

    assert adapter._notification_kwargs(''not-a-dict'') == {''disable_notification'':
    True}

    assert adapter._notification_kwargs(12345) == {''disable_notification'': True}

    '
  test_quiet_notifications_cron_semantics: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    assert adapter._notification_kwargs({''job_id'': ''job1'', ''notify'': False})
    == {''disable_notification'': True}

    assert adapter._notification_kwargs({''origin'': ''cron'', ''notify_delivery'':
    False}) == {''disable_notification'': True}

    assert adapter._notification_kwargs({''job_id'': ''job1''}) == {}

    '
  test_quiet_notifications_system_alerts: 'from plugins.platforms.telegram.adapter
    import TelegramAdapter

    adapter = object.__new__(TelegramAdapter)

    adapter._notifications_mode = ''quiet''

    assert adapter._notification_kwargs({''is_system_restart'': True}) == {}

    assert adapter._notification_kwargs({''is_update_notification'': True}) == {}

    assert adapter._notification_kwargs({''is_fatal_alert'': True}) == {}

    assert adapter._notification_kwargs({''is_approval_prompt'': True}) == {}

    assert adapter._notification_kwargs({''is_clarify_prompt'': True}) == {}

    '
targets:
- file: plugins/platforms/telegram/adapter.py
  description: 'Строгая quiet-first политика уведомлений: системный шум и команды
    мютятся (disable_notification=True), звук строго для финальных ответов, approval,
    clarify, cron, рестартов и обновлений'
  old_block: "    def _notification_kwargs(self, metadata: Optional[dict[str, Any]])\
    \ -> dict[str, Any]:\n        \"\"\"In \"important\" mode return disable_notification=True\
    \ unless ``notify`` or ``is_approval_prompt`` (#132516).\"\"\"\n        if getattr(self,\
    \ \"_notifications_mode\", \"important\") != \"important\" or (metadata or {}).get(\"\
    notify\") \\\n                or (metadata or {}).get(\"is_approval_prompt\"):\n\
    \            return {}\n        return {\"disable_notification\": True}"
  new_block: "    def _notification_kwargs(self, metadata: Optional[dict[str, Any]])\
    \ -> dict[str, Any]:\n        \"\"\"Determine disable_notification for outgoing\
    \ Telegram messages.\n\n        Quiet-first policy: All messages are muted (disable_notification=True)\
    \ by default,\n        UNLESS explicitly belonging to an audible category:\n \
    \       1. Final agent response to a user request (agent_turn_final / final_turn\
    \ / turn_final)\n        2. Interactive approval prompts & human input (is_approval_prompt\
    \ / is_clarify_prompt / confirm_action)\n        3. Scheduled cron job outputs\
    \ (job_id / cron_job / origin='cron')\n        4. Fatal / emergency alerts (is_fatal_alert)\n\
    \        5. Explicit force_notify / audible override\n        \"\"\"\n       \
    \ mode = getattr(self, \"_notifications_mode\", \"quiet\")\n        if mode ==\
    \ \"all\":\n            return {}\n\n        meta = metadata if isinstance(metadata,\
    \ dict) else {}\n        if mode == \"important\" and (meta.get(\"notify\") or\
    \ meta.get(\"is_approval_prompt\")) and not meta.get(\"is_command_reply\"):\n\
    \            return {}\n        # 1. Explicit force override always rings\n  \
    \      if meta.get(\"force_notify\") or meta.get(\"sound\") or meta.get(\"audible\"\
    ):\n            return {}\n\n        # 2. Explicit quiet override always mutes\n\
    \        if meta.get(\"quiet\") or meta.get(\"silent\") or meta.get(\"disable_notification\"\
    ):\n            return {\"disable_notification\": True}\n\n        # 3. Interactive\
    \ human prompts, approvals and alerts ring\n        if (\n            meta.get(\"\
    is_approval_prompt\")\n            or meta.get(\"is_clarify_prompt\")\n      \
    \      or meta.get(\"confirm_action\")\n            or meta.get(\"is_fatal_alert\"\
    )\n            or meta.get(\"is_system_restart\")\n            or meta.get(\"\
    is_update_notification\")\n        ):\n            return {}\n\n        # 4. Scheduled\
    \ cron jobs ring (unless explicitly muted)\n        if meta.get(\"job_id\") or\
    \ meta.get(\"cron_job\") or meta.get(\"origin\") == \"cron\":\n            if\
    \ meta.get(\"notify\") is False or meta.get(\"notify_delivery\") is False:\n \
    \               return {\"disable_notification\": True}\n            return {}\n\
    \n        # 5. Final turn of agent response rings\n        if meta.get(\"agent_turn_final\"\
    ) or meta.get(\"final_turn\") or meta.get(\"turn_final\"):\n            return\
    \ {}\n\n        # 6. Slash commands: check audible_commands whitelist\n      \
    \  if meta.get(\"is_command_reply\") or meta.get(\"command\"):\n            cmd\
    \ = str(meta.get(\"command\") or \"\").lstrip(\"/\").strip().lower()\n       \
    \     audible_cmds = getattr(self, \"_audible_commands\", False)\n           \
    \ default_whitelist = {\"voice\", \"listen\", \"tts\", \"status\", \"agents\"\
    , \"usage\"}\n            if isinstance(audible_cmds, bool):\n               \
    \ if audible_cmds and cmd in default_whitelist:\n                    return {}\n\
    \                return {\"disable_notification\": True}\n            elif isinstance(audible_cmds,\
    \ (set, list, tuple)):\n                if cmd in audible_cmds:\n            \
    \        return {}\n                return {\"disable_notification\": True}\n\
    \            return {\"disable_notification\": True}\n\n        # Default quiet-first\
    \ fallback: mute\n        return {\"disable_notification\": True}"
