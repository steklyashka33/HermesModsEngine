    из config.yaml
  old_block: "def _resolve_notifications_mode() -> str:\n    \"\"\"Notification mode\
    \ (all/important) from env, else config.yaml display.platforms.telegram.notifications.\"\
    \"\"\n    mode = os.getenv(\"HERMES_TELEGRAM_NOTIFICATIONS\", \"\")\n    if not\
    \ mode:\n        try:\n            from gateway.config import load_gateway_config\n\
    \            from gateway.run import cfg_get\n            _raw = cfg_get(load_gateway_config(),\
    \ \"display\", \"platforms\", \"telegram\", \"notifications\")\n            if\
    \ _raw not in {None, \"\"}:\n                mode = str(_raw).strip().lower()\n\
    \        except Exception:\n            pass\n    mode = mode or \"important\"\
    \n    if mode not in {\"all\", \"important\"}:\n        logger.warning(\"Unknown\
    \ telegram notifications mode '%s', defaulting to 'important' (valid: all, important)\"\
    , mode)\n        mode = \"important\"\n    return mode\n\n\ndef _build_adapter(config):\n\
    \    \"\"\"Construct TelegramAdapter and apply the notification mode.\"\"\"\n\
    \    adapter = TelegramAdapter(config)\n    try:\n        adapter._notifications_mode\
    \ = _resolve_notifications_mode()\n    except Exception:\n        adapter._notifications_mode\
    \ = \"important\"\n    return adapter"
  new_block: "def _resolve_notifications_mode() -> str:\n    \"\"\"Notification mode\
    \ (all/quiet) from env, else config.yaml display.platforms.telegram.notifications.\"\
    \"\"\n    mode = os.getenv(\"HERMES_TELEGRAM_NOTIFICATIONS\", \"\")\n    if not\
    \ mode:\n        try:\n            from gateway.config import load_gateway_config\n\
    \            from gateway.run import cfg_get\n            _raw = cfg_get(load_gateway_config(),\
    \ \"display\", \"platforms\", \"telegram\", \"notifications\")\n            if\
    \ _raw not in {None, \"\"}:\n                mode = str(_raw).strip().lower()\n\
    \        except Exception:\n            pass\n    mode = (mode or \"quiet\").strip().lower()\n\
    \    if mode in {\"important\", \"smart\", \"default\", \"quiet\"}:\n        mode\
    \ = \"quiet\"\n    elif mode != \"all\":\n        logger.warning(\"Unknown telegram\
    \ notifications mode '%s', defaulting to 'quiet' (valid: all, quiet)\", mode)\n\
    \        mode = \"quiet\"\n    return mode\n\n\ndef _build_adapter(config):\n\
    \    \"\"\"Construct TelegramAdapter and apply the notification mode.\"\"\"\n\
    \    adapter = TelegramAdapter(config)\n    try:\n        adapter._notifications_mode\
    \ = _resolve_notifications_mode()\n    except Exception:\n        adapter._notifications_mode\
    \ = \"quiet\"\n    try:\n        from hermes_cli.config import load_config_readonly\n\
    \        cfg = load_config_readonly() or {}\n        mod_opts = cfg.get(\"mods\"\
    , {}).get(\"telegram-quiet-notifications\", {})\n        adapter._audible_commands\
    \ = bool(mod_opts.get(\"audible_commands\", False))\n    except Exception:\n \
    \       adapter._audible_commands = False\n    return adapter"
