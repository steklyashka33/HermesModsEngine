id: telegram-quiet-notifications
i18n:
  en:
    name: Telegram Quiet Notifications
    description: 'Quiet-first Telegram notification policy: mute routine slash command
      replies and topic seeds, preserve audible alerts for urgent events'
    config:
      audible_commands:
        title: Audible Slash Commands
        description: Whether to play sound for slash command replies (default false
          - quiet mode)
  ru:
    name: Telegram Quiet Notifications
    description: 'Комплексный аудит и мют системного шума в Telegram: тихий режим
      по умолчанию для всех команд и служебных сообщений'
    config:
      audible_commands:
        title: Звук для слэш-команд
        description: Включать ли звук для ответов на слэш-команды (по умолчанию выключено
          — тихий режим)
  es:
    name: Telegram Quiet Notifications
    description: 'Política de notificaciones silenciosas en Telegram: silenciar respuestas
      rutinarias a comandos slash y preservar alertas sonoras para eventos urgentes'
    config:
      audible_commands:
        title: Sonido para comandos slash
        description: 'Activar sonido para respuestas a comandos slash (desactivado
          por defecto: modo silencioso)'
  fr:
    name: Telegram Quiet Notifications
    description: 'Politique de notifications silencieuses sur Telegram : couper le
      son des réponses de routine aux commandes slash et conserver les alertes pour
      les urgences'
    config:
      audible_commands:
        title: Son pour les commandes slash
        description: 'Activer le son pour les réponses aux commandes slash (désactivé
          par défaut : mode silencieux)'
  zh:
    name: Telegram Quiet Notifications
    description: Telegram静音优先通知策略：静音常规斜杠命令回复与话题创建，保留紧急事件的声音提醒
    config:
      audible_commands:
        title: 斜杠命令提示音
        description: 是否为斜杠命令回复开启声音提示（默认关闭：静音模式）
  ar:
    name: Telegram Quiet Notifications
    description: 'سياسة الإشعارات الصامتة أولاً في تيليجرام: كتم ردود أوامر الشرطة
      المائلة الروتينية والحفاظ على التنبيهات الصوتية للأحداث العاجلة'
    config:
      audible_commands:
        title: صوت أوامر الشرطة المائلة
        description: ما إذا كان سيتم تشغيل الصوت للردود على أوامر الشرطة المائلة (معطل
          افتراضيًا — وضع صامت)
  de:
    name: Telegram Quiet Notifications
    description: 'Stille Benachrichtigungsrichtlinie für Telegram: Stummschalten von
      Routine-Slash-Befehlen und Beibehalten von Tönen für dringende Ereignisse'
    config:
      audible_commands:
        title: Ton für Slash-Befehle
        description: Ob Ton für Antworten auf Slash-Befehle abgespielt werden soll
          (standardmäßig aus — lautloser Modus)
  pt:
    name: Telegram Quiet Notifications
    description: 'Política de notificações silenciosas no Telegram: silenciar respostas
      rotineiras de comandos slash e preservar alertas sonoros para eventos urgentes'
    config:
      audible_commands:
        title: Som para comandos slash
        description: 'Ativar som para respostas a comandos slash (desativado por padrão:
          modo silencioso)'
