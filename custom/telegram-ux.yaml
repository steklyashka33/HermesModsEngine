- file: plugins/platforms/telegram/adapter.py
  description: Support multiline expandable blockquotes in format_message
  old_block: "        # 9) Blockquotes: protect leading > from escaping; expandable\
    \ quotes (**> starts, trailing || ends).\n        def _convert_blockquote(m):\n\
    \            prefix, content = m.group(1), m.group(2)  # prefix: >, >>, >>>, **>,\
    \ **>> …\n            if prefix.startswith('**') and content.endswith('||'):\n\
    \                return _ph(f'{prefix} {_escape_mdv2(content[:-2])}||')\n    \
    \        return _ph(f'{prefix} {_escape_mdv2(content)}')\n\n        text = re.sub(r'^((?:\\\
    *\\*)?>{1,3}) (.+)$', _convert_blockquote, text, flags=re.MULTILINE)\n"
  new_block: "        # 9) Blockquotes: protect leading > from escaping; expandable\
    \ quotes (**> starts, trailing || ends).\n        def _convert_expandable_multiline(m):\n\
    \            lines = m.group(0).splitlines()\n            res_lines = []\n   \
    \         for i, line in enumerate(lines):\n                is_last = (i == len(lines)\
    \ - 1)\n                m_l = re.match(r\"^(\\*{0,2}>{1,3})\\s?(.*)$\", line)\n\
    \                if m_l:\n                    pref, rest = m_l.group(1), m_l.group(2)\n\
    \                else:\n                    pref, rest = (\">\", line.strip())\
    \ if line.strip() else (\">\", \"\")\n\n                if is_last and rest.endswith(\"\
    ||\"):\n                    inner = rest[:-2].strip()\n                    res_lines.append(f\"\
    {pref} {_escape_mdv2(inner)}||\" if inner else f\"{pref}||\")\n              \
    \  elif rest.strip():\n                    res_lines.append(f\"{pref} {_escape_mdv2(rest)}\"\
    )\n                else:\n                    res_lines.append(pref)\n       \
    \     joiner = chr(10)\n            return _ph(joiner.join(res_lines))\n\n   \
    \     exp_pattern = r\"(?m)^(\\*{2}> ?(?:[^\\n]*?\\n(?:> ?[^\\n]*\\n|[ \\t]*\\\
    n)*> ?[^\\n]*?|[^\\n]*?)\\|\\|)$\"\n        text = re.sub(exp_pattern, _convert_expandable_multiline,\
    \ text)\n\n        def _convert_blockquote(m):\n            prefix, content =\
    \ m.group(1), m.group(2) or \"\"\n            if prefix.startswith(\"**\") and\
    \ content.endswith(\"||\"):\n                return _ph(f\"{prefix} {_escape_mdv2(content[:-2])}||\"\
    )\n            if content.strip():\n                return _ph(f\"{prefix} {_escape_mdv2(content)}\"\
    )\n            return _ph(prefix)\n\n        text = re.sub(r\"^((?:\\*\\*)?>{1,3})(?:\
    \ (.+))?$\", _convert_blockquote, text, flags=re.MULTILINE)\n"
