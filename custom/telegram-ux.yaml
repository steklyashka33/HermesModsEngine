- file: plugins/platforms/telegram/adapter.py
  description: Clean architectural definition of _rich_eligible and _should_attempt_rich
    with agent_turn_final contract and fallback
  old_block: "    def _rich_eligible(self, content: str) -> bool:\n        \"\"\"\
    Rich eligibility ignoring ``expect_edits`` (a streamed preview's FINAL edit still\
    \ upgrades).\"\"\"\n        return bool(\n            self._rich_delivery_enabled()\n\
    \            and not getattr(self, \"_rich_send_disabled\", False)\n         \
    \   and content and content.strip()\n            and self._needs_rich_rendering(content)\n\
    \            and self._rich_content_ok(content))\n\n    def _should_attempt_rich(self,\
    \ content: str, metadata: Optional[dict[str, Any]] = None) -> bool:\n        return\
    \ bool(not (metadata or {}).get(\"expect_edits\") and self._rich_eligible(content))"
  new_block: "    def _rich_eligible(self, content: str) -> bool:\n        \"\"\"\
    Rich eligibility ignoring ``expect_edits``: capability, limits, and desktop crash\
    \ safety.\"\"\"\n        return bool(\n            self._rich_delivery_enabled()\n\
    \            and not getattr(self, \"_rich_send_disabled\", False)\n         \
    \   and content and content.strip()\n            and self._rich_content_ok(content))\n\
    \n    def _should_attempt_rich(self, content: str, metadata: Optional[dict[str,\
    \ Any]] = None) -> bool:\n        meta = metadata if isinstance(metadata, dict)\
    \ else {}\n        if meta.get(\"expect_edits\"):\n            return False\n\
    \        # 1. Structural contract: assistant final turn responses ALWAYS use Rich-first.\n\
    \        if meta.get(\"agent_turn_final\"):\n            return self._rich_eligible(content)\n\
    \        # 2. Backward compatibility & direct calls: check if content specifically\
    \ requires rich constructs.\n        if self._needs_rich_rendering(content):\n\
    \            return self._rich_eligible(content)\n        return False"
