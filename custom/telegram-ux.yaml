      (tabelas, LaTeX, spoilers), citações multilinha e agrupamento de lotes de fotos'
tests:
  test_telegram_adapter_contracts: 'from plugins.platforms.telegram.adapter import
    TelegramAdapter, _repair_telegram_chunks

    assert callable(_repair_telegram_chunks)

    assert hasattr(TelegramAdapter, "_rich_eligible")

    assert hasattr(TelegramAdapter, "_should_attempt_rich")

    assert hasattr(TelegramAdapter, "_send_text_locked")

    '
  test_telegram_ux_suite: "import subprocess\nres = subprocess.run([\n    \"/usr/local/lib/hermes-agent/venv/bin/pytest\"\
    , \"-q\",\n    \"/usr/local/lib/hermes-agent/tests/plugins/platforms/telegram/\"\
    \n], capture_output=True, text=True)\nassert res.returncode == 0, res.stdout +\
    \ res.stderr\n"
