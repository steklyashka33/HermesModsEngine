  description: Add _repair_telegram_chunks helper and _mdv2_to_mdv1 fallback
  old_block: "def _separate_chunk_indicator_from_fence(text: str) -> str:\n    \"\"\
    \"Move a ``(N/M)`` chunk marker that ``truncate_message()`` appended to a synthesized\
    \ closing\n    fence onto its own line — Telegram rejects ````` \\\\(1/2\\\\)``\
    \ as a fence.\"\"\"\n    return _CHUNK_INDICATOR_ON_FENCE_RE.sub(r'```\\n\\g<indicator>',\
    \ text)"
  new_block: "def _separate_chunk_indicator_from_fence(text: str) -> str:\n    r\"\
    \"\"Move a ``(N/M)`` chunk marker that ``truncate_message()`` appended to a synthesized\
    \ closing\n    fence onto its own line — Telegram rejects ````` \\(1/2\\)`` as\
    \ a fence.\"\"\"\n    return _CHUNK_INDICATOR_ON_FENCE_RE.sub(r'```\\n\\g<indicator>',\
    \ text)\n\n\n_CHUNK_INDICATOR_STRIP_RE = re.compile(r'\\s*(?:\\(\\d+/\\d+\\)|\\\
    \\\\\\\\(\\d+/\\d+\\\\\\\\\\))\\s*$')\n\n\ndef _repair_telegram_chunks(chunks:\
    \ list[str]) -> list[str]:\n    \"\"\"Ensure multi-chunk Telegram messages preserve\
    \ valid MarkdownV2 formatting across splits.\n    1. Removes distracting (N/M)\
    \ chunk suffixes.\n    2. Closes unclosed expandable blockquotes (||) at chunk\
    \ tails and reopens (**>) at chunk heads.\n    \"\"\"\n    if not chunks:\n  \
    \      return []\n    repaired: list[str] = []\n    in_expandable = False\n\n\
    \    for chunk in chunks:\n        if not chunk:\n            repaired.append(\"\
    \")\n            continue\n        c = _CHUNK_INDICATOR_STRIP_RE.sub('', chunk)\n\
    \        lines = c.splitlines()\n\n        if in_expandable:\n            if lines\
    \ and lines[0].startswith('> '):\n                lines[0] = '**> ' + lines[0][2:]\n\
    \            elif lines and not lines[0].startswith('**> '):\n               \
    \ lines[0] = '**> ' + lines[0]\n\n        chunk_text = '\\n'.join(lines)\n   \
    \     has_open_exp = '**> ' in chunk_text\n        has_close_exp = chunk_text.endswith('||')\n\
    \n        if in_expandable or has_open_exp:\n            if not has_close_exp:\n\
    \                if lines:\n                    lines[-1] = lines[-1] + '||'\n\
    \                in_expandable = True\n            else:\n                in_expandable\
    \ = False\n\n        repaired.append('\\n'.join(lines))\n\n    return repaired\n\
    \n\ndef _mdv2_to_mdv1(text: str) -> str:\n    \"\"\"Convert MarkdownV2-formatted\
    \ text to classic Telegram Markdown (v1) as fallback.\n    Preserves bold (*text*),\
    \ monospace (`code` / ```pre```), and links [text](url).\n    Unescapes punctuation\
    \ (. - ~ ( ) ! + = | { } > # [ ]) that is reserved in v2 but\n    must not be\
    \ escaped in v1.\n    \"\"\"\n    if not text:\n        return text or \"\"\n\
    \    placeholders: dict[str, str] = {}\n    counter = [0]\n\n    def _ph(val:\
    \ str) -> str:\n        k = f\"\\x00MDV1_{counter[0]}\\x00\"\n        counter[0]\
    \ += 1\n        placeholders[k] = val\n        return k\n\n    text = re.sub(r'```[\\\
    s\\S]*?```', lambda m: _ph(m.group(0)), text)\n    text = re.sub(r'`[^`\\n]+`',\
    \ lambda m: _ph(m.group(0)), text)\n    text = re.sub(r'\\[[^\\]]+\\]\\([^)]+\\\
    )', lambda m: _ph(m.group(0)), text)\n    text = re.sub(r'\\\\([.\\-~()!+=|{}>#\\\
    [\\]])', r'\\1', text)\n\n    for k in reversed(list(placeholders.keys())):\n\
    \        text = text.replace(k, placeholders[k])\n    return text"
