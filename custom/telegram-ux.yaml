  en:
    name: Telegram UX & Rich Formatting
    description: 'Telegram rich messaging UX: delivery of rich formatting (tables,
      LaTeX, spoilers), multiline quotes, and photo burst grouping'
  ru:
    name: Telegram UX & Rich Formatting
    description: 'Комплексный UX Telegram: доставка Rich Messages (таблицы, LaTeX,
      спойлеры), поддержка multiline-цитат и группировка фото-пакетов'
  es:
    name: Telegram UX & Rich Formatting
    description: 'UX enriquecido de Telegram: entrega de formato avanzado (tablas,
      LaTeX, spoilers), citas multilínea y agrupación de ráfagas de fotos'
  fr:
    name: Telegram UX & Rich Formatting
    description: 'Expérience enrichie sur Telegram : prise en charge du formatage
      enrichi (tableaux, LaTeX, spoilers), citations multilignes et regroupement de
      photos'
  zh:
    name: Telegram UX & Rich Formatting
    description: Telegram富文本消息UX优化：支持富文本格式化（表格、LaTeX、剧透内容）、多行引用及连拍照片智能分组
  ar:
    name: Telegram UX & Rich Formatting
    description: 'تجربة مستخدم غنية لتيليجرام: تسليم التنسيق الغني (الجداول، LaTeX،
