tests:
  test_multimodal_fallback_envelope: 'from agent.transports.chat_completions import
    ChatCompletionsTransport

    assert hasattr(ChatCompletionsTransport, "convert_messages")

    from agent.message_sanitization import strip_images_for_rejecting_model

    assert callable(strip_images_for_rejecting_model)

    '
  test_tool_media_extraction: "from agent.transports.chat_completions import ChatCompletionsTransport\n\
    transport = ChatCompletionsTransport()\nraw_msgs = [\n    {\"role\": \"user\"\
    , \"content\": \"check image\"},\n    {\"role\": \"assistant\", \"content\": \"\
    running tool\", \"tool_calls\": [{\"id\": \"t1\", \"function\": {\"name\": \"\
    browser_vision\"}}]},\n    {\"role\": \"tool\", \"tool_call_id\": \"t1\", \"content\"\
    : [\n        {\"type\": \"text\", \"text\": \"analysis done\"},\n        {\"type\"\
    : \"image_url\", \"image_url\": {\"url\": \"data:image/png;base64,abc\"}}\n  \
    \  ]}\n]\nconverted = transport.convert_messages(raw_msgs, provider=\"openai\"\
    )\nassert any(m.get(\"role\") == \"user\" and isinstance(m.get(\"content\"), list)\
    \ and any(p.get(\"type\") == \"image_url\" for p in m.get(\"content\", [])) for\
    \ m in converted)\n"
