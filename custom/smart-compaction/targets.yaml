- file: agent/context_compressor.py
  description: Определение функции get_smart_compaction_config для чтения параметров
    mods.smart_compaction
  old_block: "def resolve_model_threshold(\n    model: str, model_thresholds: dict[str,\
    \ float] | None, default: float, provider: str = \"\",\n) -> float:"
  new_block: "def get_smart_compaction_config() -> dict[str, Any]:\n    \"\"\"Resolve\
    \ smart_compaction parameters from config.yaml under mods.smart_compaction.\"\"\
    \"\n    defaults = {\n        \"enabled\": True,\n        \"idle_seconds\": 3600,\n\
    \        \"live_threshold_ratio\": 0.70,\n        \"min_prune_chars\": 4000,\n\
    \        \"min_reclaim_tokens\": 20000,\n    }\n    try:\n        import os\n\
    \        from pathlib import Path\n        import yaml\n        from hermes_constants\
    \ import get_hermes_home\n        cfg_path = get_hermes_home() / \"config.yaml\"\
    \n        if not cfg_path.exists():\n            cfg_path = Path(os.environ.get(\"\
    HERMES_CONFIG_FILE\", Path(os.environ.get(\"HERMES_HOME\", Path.home() / \".hermes\"\
    )) / \"config.yaml\"))\n        if cfg_path.exists():\n            with open(cfg_path,\
    \ \"r\", encoding=\"utf-8\") as f:\n                data = yaml.safe_load(f) or\
    \ {}\n            mods = data.get(\"mods\", {}) if isinstance(data, dict) else\
    \ {}\n            sc = {}\n            if isinstance(mods.get(\"smart_compaction\"\
    ), dict):\n                sc.update(mods[\"smart_compaction\"])\n           \
    \ if isinstance(mods.get(\"smart-compaction\"), dict):\n                sc.update(mods[\"\
    smart-compaction\"])\n            if sc:\n                res = dict(defaults)\n\
    \                for k in defaults:\n                    if k in sc and sc[k]\
    \ is not None:\n                        res[k] = sc[k]\n                return\
    \ res\n    except Exception:\n        pass\n    return defaults\n\n\ndef resolve_model_threshold(\n\
    \    model: str, model_thresholds: dict[str, float] | None, default: float, provider:\
    \ str = \"\",\n) -> float:"
- file: agent/context_compressor.py
  description: Реализация маркеров сжатых тулов (_sum_read_file, _sum_terminal, _sum_write_file,
    _sum_search_files) без chars/lines и с полной командой
  old_block: "def _sum_terminal(name, args, content, content_len, line_count):\n \
    \   cmd = _str_arg(args, \"command\")\n    cmd = cmd if len(cmd) <= 80 else cmd[:77]\
    \ + \"...\"\n    exit_code = m.group(1) if (m := re.search(r'\"exit_code\"\\s*:\\\
    s*(-?\\d+)', content)) else \"?\"\n    return f\"[terminal] ran `{cmd}` -> exit\
    \ {exit_code}, {line_count} lines output\"\n\n\ndef _sum_write_file(name, args,\
    \ content, content_len, line_count):\n    # A refused write (stale-write guard,\
    \ sensitive path, I/O error) changed nothing; summarized as\n    # \"wrote to\"\
    \ it compresses into a success the post-compaction agent then reports.\n    if\
    \ failed := _result_failure_suffix(content):\n        return f\"[write_file] {args.get('path',\
    \ '?')}{failed}\"\n    written_lines = _str_arg(args, \"content\").count(\"\\\
    n\") + 1 if args.get(\"content\") else \"?\"\n    return f\"[write_file] wrote\
    \ to {args.get('path', '?')} ({written_lines} lines)\"\n\n\ndef _sum_search_files(name,\
    \ args, content, content_len, line_count):\n    count = m.group(1) if (m := re.search(r'\"\
    total_count\"\\s*:\\s*(\\d+)', content)) else \"?\"\n    return (\n        f\"\
    [search_files] {args.get('target', 'content')} search for \"\n        f\"'{args.get('pattern',\
    \ '?')}' in {args.get('path', '.')} -> {count} matches\"\n    )"
  new_block: "def _sum_read_file(name, args, content, content_len, line_count):\n\
    \    path = args.get(\"path\", \"?\")\n    failed = _result_failure_suffix(content)\n\
    \    if failed:\n        return f\"[read_file] {path}{failed}\"\n    return f\"\
    [read_file] {path} -> truncated\"\n\n\ndef _sum_terminal(name, args, content,\
    \ content_len, line_count):\n    cmd = _str_arg(args, \"command\")\n    exit_code\
    \ = m.group(1) if (m := re.search(r'\"exit_code\"\\s*:\\s*(-?\\d+)', content))\
    \ else \"?\"\n    return f\"[terminal] ran `{cmd}` -> exit {exit_code}\"\n\n\n\
    def _sum_write_file(name, args, content, content_len, line_count):\n    path =\
    \ args.get(\"path\", \"?\")\n    if failed := _result_failure_suffix(content):\n\
    \        return f\"[write_file] {path}{failed}\"\n    return f\"[write_file] wrote\
    \ to {path}\"\n\n\ndef _sum_search_files(name, args, content, content_len, line_count):\n\
    \    pattern = args.get(\"pattern\", \"?\")\n    path = args.get(\"path\", \"\
    .\")\n    if failed := _result_failure_suffix(content):\n        return f\"[search_files]\
    \ pattern='{pattern}' path='{path}'{failed}\"\n    return f\"[search_files] pattern='{pattern}'\
    \ path='{path}'\""
