    \ = _reanchor(agent, out.messages, user_message)\n        _reset_read_dedup_caches(effective_task_id,\
    \ session_id=agent.session_id or \"\")\n\n\ndef run_turn_start_compaction(\n \
    \   agent: Any, *, messages: list[dict[str, Any]], system_message: Optional[str],\n\
    \    active_system_prompt: Optional[str], conversation_history: Optional[list[dict[str,\
    \ Any]]],\n    current_turn_user_idx: int, user_message: Any, effective_task_id:\
    \ str,\n) -> CompactionOutcome:\n    \"\"\"Idle compaction, then preflight compression\
