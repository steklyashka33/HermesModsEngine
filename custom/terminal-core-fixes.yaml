tests:
  test_drain_fd_select_high_descriptor: 'import os, codecs, resource

    from unittest.mock import MagicMock

    from tools.environments.base_output import _BoundedOutputCollector, _drain_fd_select

    soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)

    resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 2048), hard))

    r, w = os.pipe()

    r_high = os.dup2(r, 1025)

    os.close(r)

    os.write(w, b"poll-test\n")

    os.close(w)

    proc = MagicMock()

    proc.poll.return_value = 0

    output = _BoundedOutputCollector(100)

    decoder = codecs.getincrementaldecoder("utf-8")("replace")

    _drain_fd_select(proc, r_high, output, decoder)

    os.close(r_high)

    assert "poll-test" in output.render()

    '
