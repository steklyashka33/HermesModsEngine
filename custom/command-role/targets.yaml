    \ используйте `/role add <текст>` для дополнения или `/role clear` для сброса._\"\
    \n        )\n\n    if args.lower() in (\"clear\", \"reset\", \"off\", \"del\"\
    , \"remove\", \"сброс\", \"очистить\"):\n        session[\"session_role\"] = \"\
    \"\n        agent = session.get(\"agent\")\n        if agent and hasattr(agent,\
