tests:
  test_pairing_store_fallback_and_cascading: "from gateway.pairing import PairingStore\n\
    rs = PairingStore()\nappr = rs.list_approved(\"telegram\")\nuid = appr[0][\"user_id\"\
    ] if appr else \"test_uid\"\nif not appr:\n    rs.approve_request(\"test\", \"\
    telegram\", uid, \"User\")\nps = PairingStore(profile=\"test_fallback\")\nassert\
    \ ps.is_approved(\"telegram\", uid) is True\n"
