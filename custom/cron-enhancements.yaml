tests:
  test_merge_mcp_per_job_toolsets: 'from cron.scheduler import _merge_mcp_into_per_job_toolsets

    cfg = {"mcp_servers": {"s1": {"command": "x"}, "s2": {"command": "y"}}}

    res = _merge_mcp_into_per_job_toolsets(["web", "mcp-s1"], cfg)

    assert res == ["web", "mcp-s1"]

    '
