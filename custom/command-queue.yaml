- file: gateway/run_busy.py
  description: Обработка подкоманд /queue next, /queue status, /queue next off в _busy_queue_command
  old_block: "    async def _busy_queue_command(self, event: MessageEvent, quick_key:\
    \ str, source):\n        # Each /queue is its own full agent turn, run FIFO after\
    \ the current run; never merged.\n        queued_text = event.get_command_args().strip()\n\
    \        # A /queue carrying media or reply context is valid with no prompt text\
    \ (image caption).\n        has_media = bool(getattr(event, \"media_urls\", None))\n\
    \        if not queued_text and not has_media:\n            return t(\"gateway.queue.usage\"\
    )\n        await _busy_accepted()\n        adapter = self._delivery_adapter_for(source)"
  new_block: "    async def _busy_queue_command(self, event: MessageEvent, quick_key:\
    \ str, source):\n        # Each /queue is its own full agent turn, run FIFO after\
    \ the current run; never merged.\n        queued_text = event.get_command_args().strip()\n\
    \        lowered = queued_text.lower()\n        if lowered in (\"next\", \"след\"\
    , \"следующее\", \"next on\"):\n            self._arm_queue_next(quick_key)\n\
    \            return \"\U0001F4E5 Следующее сообщение будет поставлено в очередь\
    \ без прерывания текущей задачи.\"\n        if lowered in (\"next off\", \"next\
    \ clear\", \"cancel\"):\n            if self._disarm_queue_next(quick_key):\n\
    \                return \"❌ Режим очереди для следующего сообщения отменён.\"\n\
    \            return \"ℹ️ Режим очереди для следующего сообщения не был активен.\"\
    \n        if lowered == \"status\":\n            adapter = self._delivery_adapter_for(source)"
