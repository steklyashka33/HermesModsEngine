  description: 'Обновление CommandDef queue: поддержка аргументов next [off], status,
    cancel'
  old_block: "    CommandDef(\"queue\", \"Queue a prompt for the next turn, or list/edit/rm/move/clear\
    \ queued prompts\", \"Session\",\n               aliases=(\"q\",), args_hint=\"\
    [<prompt>|list|edit N <prompt>|rm N|move A B|clear]\",\n               subcommands=(\"\
    list\", \"edit\", \"rm\", \"move\", \"clear\", \"add\"),\n               busy_policy=\"\
    dispatch\", busy_handler=\"queue\"),"
  new_block: "    CommandDef(\"queue\", \"Queue a prompt for the next turn, or list/edit/rm/move/clear\
    \ queued prompts\", \"Session\",\n               aliases=(\"q\",), args_hint=\"\
    [next [off]|status|<prompt>|list|edit N <prompt>|rm N|move A B|clear]\",\n   \
    \            subcommands=(\"next\", \"status\", \"cancel\", \"clear\", \"list\"\
    , \"edit\", \"rm\", \"move\", \"add\"),\n               busy_policy=\"dispatch\"\
    , busy_handler=\"queue\"),"
- file: gateway/run_busy.py
  description: Сессионный фиксатор очереди _queue_next_sessions (arm/disarm/is_armed/consume
    с TTL 1ч)
  old_block: "    def _queue_during_drain_enabled(self, busy_input_mode: Optional[str]\
    \ = None) -> bool:\n        # \"queue\"/\"steer\" mean messages survive a restart\
    \ (queued for the new process); \"interrupt\" drops.\n        mode = busy_input_mode\
    \ or self._busy_input_mode\n        return self._restart_requested and mode in\
    \ {\"queue\", \"steer\"}\n\n    def _overflow_queue(self, session_key: str):"
  new_block: "    def _queue_during_drain_enabled(self, busy_input_mode: Optional[str]\
    \ = None) -> bool:\n        # \"queue\"/\"steer\" mean messages survive a restart\
    \ (queued for the new process); \"interrupt\" drops.\n        mode = busy_input_mode\
    \ or self._busy_input_mode\n        return self._restart_requested and mode in\
    \ {\"queue\", \"steer\"}\n\n    _queue_next_sessions: dict[str, float] = {}\n\n\
    \    def _arm_queue_next(self, session_key: str) -> None:\n        if not hasattr(self,\
    \ \"_queue_next_sessions\") or self._queue_next_sessions is None:\n          \
    \  self._queue_next_sessions = {}\n        self._queue_next_sessions[session_key]\
    \ = time.time()\n\n    def _disarm_queue_next(self, session_key: str) -> bool:\n\
    \        if not hasattr(self, \"_queue_next_sessions\") or not self._queue_next_sessions:\n\
    \            return False\n        return self._queue_next_sessions.pop(session_key,\
    \ None) is not None\n\n    def _is_queue_next_armed(self, session_key: str) ->\
    \ bool:\n        if not hasattr(self, \"_queue_next_sessions\") or not self._queue_next_sessions:\n\
    \            return False\n        ts = self._queue_next_sessions.get(session_key)\n\
    \        if not ts:\n            return False\n        if time.time() - ts > 3600:\n\
    \            self._queue_next_sessions.pop(session_key, None)\n            return\
    \ False\n        return True\n\n    def _consume_queue_next(self, session_key:\
    \ str) -> bool:\n        if self._is_queue_next_armed(session_key):\n        \
    \    self._queue_next_sessions.pop(session_key, None)\n            return True\n\
    \        return False\n\n    def _overflow_queue(self, session_key: str):"
