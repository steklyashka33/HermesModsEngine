tests:
  test_command_queue_subcommands: 'from hermes_cli.commands import COMMAND_REGISTRY,
    resolve_command

    cmd = resolve_command("queue")

    assert cmd is not None, "/queue command must be registered"

    assert "next" in cmd.subcommands

    assert "status" in cmd.subcommands

    '
  test_queue_next_busy_policy: 'from hermes_cli.commands import resolve_command

    cmd = resolve_command("queue")

    assert cmd.busy_policy == "dispatch"

    assert cmd.busy_handler == "queue"

    '
