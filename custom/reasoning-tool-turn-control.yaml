    assert callable(finish_text_response)

    '
  test_reasoning_tokens_extraction: 'from agent.usage_pricing import _first_nonzero

    u = {"thoughts_token_count": 42}

    val = _first_nonzero(u, ("thoughts_token_count",))

    assert val == 42

    '
