    def _usage_agent_stats_lines(
        agent,
        session_entry=None,
        session_id: str = "",
        model_name: str = "",
        context_used: int = 0,
        context_total: int = 0,
    ) -> list[str]:
        """/usage session block for a live or evicted agent: rate limits, model, context, compressions,
        and concise token usage breakdown (api calls, input, output, reasoning, cache, total)."""
        lines: list[str] = []
        rl_state = agent.get_rate_limit_state() if (agent and hasattr(agent, "get_rate_limit_state")) else None
        if rl_state and rl_state.has_data:
            from agent.rate_limit_tracker import format_rate_limit_compact
            lines += [t("gateway.usage.rate_limits", state=format_rate_limit_compact(rl_state)), ""]

        u_sid = session_id or str(getattr(agent, "session_id", "") or (getattr(session_entry, "session_id", "") if session_entry else "") or "")
        u_db = _active_window_usage_from_db(u_sid) if u_sid else {"calls": 0, "input": 0, "output": 0, "reasoning": 0, "cache": 0, "total": 0, "compressions": 0}
        u_calls = max(_n(agent, "session_api_calls"), u_db.get("calls", 0))
        u_inp = max(_n(agent, "session_input_tokens"), u_db.get("input", 0))
        u_out = max(_n(agent, "session_output_tokens"), u_db.get("output", 0))
        u_rea = max(_n(agent, "session_reasoning_tokens"), u_db.get("reasoning", 0))
        u_cache = max(_n(agent, "session_cache_read_tokens") + _n(agent, "session_cache_write_tokens"), u_db.get("cache", 0))
        u_tot = (u_inp + u_cache + u_out) if (u_inp + u_cache + u_out) > 0 else (_n(agent, "session_total_tokens") or u_db.get("total", 0))
        u_prompt = u_inp + u_cache
        u_cpct = round(u_cache / u_prompt * 100) if (u_cache > 0 and u_prompt > 0) else 0

        display_model = model_name or str(getattr(agent, "model", "") or "")
        lines += [
            t("gateway.usage.label_model", model=_reverse_alias_for_display(display_model) if display_model else "?"),
        ]

        ctx = getattr(agent, "context_compressor", None) if agent else None
        used_toks = _n(ctx, "last_prompt_tokens") or context_used or (max(0, _int_value(getattr(session_entry, "last_prompt_tokens", 0))) if session_entry else 0)
        ctx_len = _n(ctx, "context_length") or context_total
        if used_toks > 0 and ctx_len > 0:
            pct = _pct(used_toks, ctx_len)
            from agent.context_breakdown import context_display_source
            is_est = (context_display_source(ctx) != "provider_usage") or (not _n(ctx, "last_prompt_tokens") and not _int_value(getattr(session_entry, "last_prompt_tokens", 0)) and used_toks > 0)
            mark = "~" if is_est else ""
            lines.append(t("gateway.usage.label_context", used=mark + _fmt(used_toks),
                           total=_fmt(ctx_len), pct=f"{mark}{pct:.0f}"))
        elif used_toks > 0:
            from agent.context_breakdown import context_display_source
            is_est = (context_display_source(ctx) != "provider_usage") or (not _n(ctx, "last_prompt_tokens") and not _int_value(getattr(session_entry, "last_prompt_tokens", 0)) and used_toks > 0)
            mark = "~" if is_est else ""
            lines.append(t("gateway.status.context_used", used=mark + _fmt(used_toks)))

        comp_count = max(_n(ctx, "compression_count"), u_db.get("compressions", 0))
        if comp_count:
            lines.append(t("gateway.usage.label_compressions", count=comp_count))

        u_total_line = (
            t("gateway.usage.label_total_with_cache", count=_fmt(u_tot), cache_pct=u_cpct, total=_fmt(u_tot))
            if u_cpct > 0
            else t("gateway.usage.label_total", count=_fmt(u_tot), total=_fmt(u_tot))
        )

        lines += [
            "",
            t("gateway.usage.header_tokens"),
            t("gateway.usage.label_api_calls", count=u_calls),
            t("gateway.usage.tokens_line", input=_fmt(u_inp), output=_fmt(u_out), reasoning=_fmt(u_rea)),
            u_total_line,
        ]
        return lines
