  new_block: "    async def _persist_manual_compression(self, tmp_agent, session_entry,\
    \ source, compressed, after_tokens: int = 0) -> None:\n        \"\"\"Commit a\
    \ manual /compress result to the session store.  Rotation (new continuation id)\n\
    \        makes the NEW session durable (already published, else rewritten) so\
    \ the original stays searchable;\n        persist BEFORE repointing so a failed\
    \ write is fatal and old history stays reachable.\n        In-place compaction\
