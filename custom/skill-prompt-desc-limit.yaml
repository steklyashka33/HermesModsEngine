id: skill-prompt-desc-limit
name: Skill Prompt Description Limit Configuration
description: Configurable skill description limit in system prompt with clean whitespace
  trimming and validation
version: 1.3.0
author: Hermes Admin
enabled: true
config:
  limit:
    type: integer
    default: 60
    description: Maximum skill description character length in system prompt (0 to
      disable truncation)
targets:
- file: agent/skill_utils.py
  description: Make SKILL_PROMPT_DESC_LIMIT configurable via mods.skill-prompt-desc-limit.limit
    and fix truncation
  old_block: "SKILL_PROMPT_DESC_LIMIT = 60\n_LAST_WHITESPACE_RE = re.compile(r\"\\\
    s\\S*$\")\n_CLIP_TRAIL_RE = re.compile(r\"[\\s.,;:\\-\\u2013\\u2014(/]+$\")\n\n\
    \ndef _normalize_skill_description(frontmatter: dict[str, Any]) -> str:\n    \"\
    \"\"Normalize a skill's description field for comparison/truncation.\"\"\"\n \
    \   raw_desc = frontmatter.get(\"description\", \"\")\n    return str(raw_desc).strip().strip(\"\
    '\\\"\") if raw_desc else \"\"\n\n\ndef clip_skill_description(desc: str) -> str:\n\
    \    \"\"\"*desc* fitted to SKILL_PROMPT_DESC_LIMIT, cut at a word boundary so\
    \ the index never shows a half word.\"\"\"\n    if len(desc) <= SKILL_PROMPT_DESC_LIMIT:\n\
    \        return desc\n    head = desc[:SKILL_PROMPT_DESC_LIMIT - 2]  # one char\
    \ past the budget: whitespace there means the last word is whole\n    boundary\
    \ = _LAST_WHITESPACE_RE.search(head)  # any whitespace (tab, NBSP, ...) separates\
    \ words, not just \" \"\n    if not boundary or boundary.start() == 0:  # a single\
    \ word longer than the budget has no boundary to cut at\n        return desc[:SKILL_PROMPT_DESC_LIMIT\
    \ - 3] + \"...\"\n    return _CLIP_TRAIL_RE.sub(\"\", head[:boundary.start()])\
    \ + \"...\"\n\n\ndef extract_skill_description(frontmatter: dict[str, Any]) ->\
    \ str:\n    \"\"\"Extract a system-prompt-length description from parsed frontmatter.\"\
    \"\"\n    return clip_skill_description(_normalize_skill_description(frontmatter))\n\
    \n\ndef is_skill_description_truncated_for_prompt(frontmatter: dict[str, Any])\
    \ -> bool:\n    \"\"\"True when the description will be truncated in the system\
    \ prompt skill index.\"\"\"\n    return len(_normalize_skill_description(frontmatter))\
    \ > SKILL_PROMPT_DESC_LIMIT"
  new_block: "DEFAULT_SKILL_PROMPT_DESC_LIMIT = 60\n\n\ndef get_skill_prompt_desc_limit()\
    \ -> int:\n    \"\"\"Resolve skill description limit from config.yaml (`mods.skill-prompt-desc-limit.limit`\
    \ or fallback).\"\"\"\n    raw_cfg = _load_raw_config()\n    if isinstance(raw_cfg,\
    \ dict):\n        mods_cfg = raw_cfg.get(\"mods\")\n        if isinstance(mods_cfg,\
    \ dict):\n            mod_val = mods_cfg.get(\"skill-prompt-desc-limit\")\n  \
    \          if isinstance(mod_val, dict) and \"limit\" in mod_val:\n          \
    \      try:\n                    return int(mod_val[\"limit\"])\n            \
    \    except (ValueError, TypeError):\n                    pass\n        skills_cfg\
    \ = raw_cfg.get(\"skills\")\n        if isinstance(skills_cfg, dict):\n      \
    \      val = skills_cfg.get(\"prompt_desc_limit\") or skills_cfg.get(\"description_limit\"\
    )\n            if val is not None:\n                try:\n                   \
    \ return int(val)\n                except (ValueError, TypeError):\n         \
    \           pass\n    return DEFAULT_SKILL_PROMPT_DESC_LIMIT\n\n\nclass _DynamicSkillDescLimit(int):\n\
    \    \"\"\"Dynamically resolves the skill prompt description limit from config\
    \ while remaining an int.\"\"\"\n    def __new__(cls):\n        return super().__new__(cls,\
    \ DEFAULT_SKILL_PROMPT_DESC_LIMIT)\n    def __int__(self):\n        return get_skill_prompt_desc_limit()\n\
    \    def __gt__(self, other):\n        return int(self) > other\n    def __lt__(self,\
    \ other):\n        return int(self) < other\n    def __ge__(self, other):\n  \
    \      return int(self) >= other\n    def __le__(self, other):\n        return\
    \ int(self) <= other\n    def __eq__(self, other):\n        return int(self) ==\
    \ other\n    def __sub__(self, other):\n        return int(self) - other\n   \
    \ def __rsub__(self, other):\n        return other - int(self)\n    def __str__(self):\n\
    \        return str(int(self))\n    def __repr__(self):\n        return repr(int(self))\n\
    \n\nSKILL_PROMPT_DESC_LIMIT = _DynamicSkillDescLimit()\n_LAST_WHITESPACE_RE =\
    \ re.compile(r\"\\s\\S*$\")\n_CLIP_TRAIL_RE = re.compile(r\"[\\s.,;:\\-\\u2013\\\
    u2014(/]+$\")\n\n\ndef _normalize_skill_description(frontmatter: dict[str, Any])\
    \ -> str:\n    \"\"\"Normalize a skill's description field for comparison/truncation.\"\
    \"\"\n    raw_desc = frontmatter.get(\"description\", \"\")\n    return str(raw_desc).strip().strip(\"\
    '\\\"\") if raw_desc else \"\"\n\n\ndef clip_skill_description(desc: str) -> str:\n\
    \    \"\"\"*desc* fitted to SKILL_PROMPT_DESC_LIMIT, cut at a word boundary so\
    \ the index never shows a half word.\"\"\"\n    limit = int(SKILL_PROMPT_DESC_LIMIT)\n\
    \    if limit <= 0:\n        return desc\n    if len(desc) <= limit:\n       \
    \ return desc\n    head = desc[:limit - 2]\n    boundary = _LAST_WHITESPACE_RE.search(head)\n\
    \    if not boundary or boundary.start() == 0:\n        return desc[:limit - 3]\
    \ + \"...\"\n    return _CLIP_TRAIL_RE.sub(\"\", head[:boundary.start()]) + \"\
    ...\"\n\n\ndef extract_skill_description(frontmatter: dict[str, Any]) -> str:\n\
    \    \"\"\"Extract a system-prompt-length description from parsed frontmatter.\"\
    \"\"\n    return clip_skill_description(_normalize_skill_description(frontmatter))\n\
    \n\ndef is_skill_description_truncated_for_prompt(frontmatter: dict[str, Any])\
    \ -> bool:\n    \"\"\"True when the description will be truncated in the system\
    \ prompt skill index.\"\"\"\n    limit = int(SKILL_PROMPT_DESC_LIMIT)\n    if\
    \ limit <= 0:\n        return False\n    return len(_normalize_skill_description(frontmatter))\
    \ > limit"
- file: tools/skill_manager_tool.py
  description: Make skill_manage tool docstring dynamically pull current limit
  old_block: "def _skill_manage_description() -> str:\n    return (\n        \"Create,\
    \ update, or delete skills — your procedural memory for \"\n        \"recurring\
    \ task types. The call is an operations array (a single \"\n        \"edit is\
    \ a list of one); it applies atomically — any failure rolls \"\n        \"every\
    \ touched skill back. Ops: create (full SKILL.md; lands in \"\n        \"the profile's\
    \ skills directory or configured skills.create_dir; must precede that skill's\
    \ other \"\n        \"ops), patch (targeted old_string/new_string fix — preferred;\
    \ \"\n        \"content alone REPLACES the whole file, read it via skill_view()\
    \ \"\n        \"first), write_file/remove_file (supporting files), delete (sole\
    \ \"\n        \"op only). Existing skills are modified wherever they live. Keep\
    \ \"\n        \"the description's first 57 chars a self-contained trigger: 'Use\
    \ \"\n        \"when <trigger>. <one-line behavior>.' Write lessons, not logs:\
    \ \"\n        \"imperative rule + why, no PR numbers/dates/incident narration,\
    \ one \"\n        \"rule per lesson, references/ named by topic (extend before\
    \ adding). \"\n        \"skill_view() shows format conventions.\"\n    )"
  new_block: "def _skill_manage_description() -> str:\n    limit = int(SKILL_PROMPT_DESC_LIMIT)\n\
    \    return (\n        \"Create, update, or delete skills — your procedural memory\
    \ for \"\n        \"recurring task types. The call is an operations array (a single\
    \ \"\n        \"edit is a list of one); it applies atomically — any failure rolls\
    \ \"\n        \"every touched skill back. Ops: create (full SKILL.md; lands in\
    \ \"\n        \"the profile's skills directory or configured skills.create_dir;\
    \ must precede that skill's other \"\n        \"ops), patch (targeted old_string/new_string\
    \ fix — preferred; \"\n        \"content alone REPLACES the whole file, read it\
    \ via skill_view() \"\n        \"first), write_file/remove_file (supporting files),\
    \ delete (sole \"\n        \"op only). Existing skills are modified wherever they\
    \ live. Keep \"\n        f\"the description under the configured budget (currently\
    \ {limit} chars) as a self-contained trigger: 'Use \"\n        \"when <trigger>.\
    \ <one-line behavior>.' Write lessons, not logs: \"\n        \"imperative rule\
    \ + why, no PR numbers/dates/incident narration, one \"\n        \"rule per lesson,\
    \ references/ named by topic (extend before adding). \"\n        \"skill_view()\
    \ shows format conventions.\"\n    )"
  disabled: true
  disabled_reason: Merged upstream in v0.22.6
