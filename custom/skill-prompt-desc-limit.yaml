tests:
  test_skill_prompt_description_limit: 'from agent.skill_utils import extract_skill_description,
    SKILL_PROMPT_DESC_LIMIT

    from tools.skill_manager_tool import _skill_manage_description


    lim = int(SKILL_PROMPT_DESC_LIMIT)

    assert f"max {lim} chars" in _skill_manage_description()

    assert extract_skill_description({"description": "a"*(lim+10)}) == "a"*(lim-3)
    + "..."

    '
